name: WP015 bounded correction cycle 1
on:
  push:
    branches:
      - execution/week1-wp015-multirate-coupling
permissions:
  contents: write
jobs:
  repair-and-validate:
    if: ${{ !contains(github.event.head_commit.message, 'WP-015 correction cycle 1') && !contains(github.event.head_commit.message, 'WP-015 cycle1 diagnostic') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Apply bounded correction cycle 1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('production/crates/multi-rate-coupling-core/src/lib.rs')
          s = p.read_text()
          s = s.replace(
              '#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum Disposition {',
              '#[derive(Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord)]\npub enum Disposition {'
          )
          p.write_text(s)
          PY
          cargo fmt --manifest-path production/Cargo.toml --all
      - name: Validate corrected candidate
        run: |
          set +e
          cargo clippy --manifest-path production/Cargo.toml --workspace --all-targets -- -D warnings > /tmp/wp015-clippy.log 2>&1
          CLIPPY=$?
          cargo test --manifest-path production/Cargo.toml --workspace > /tmp/wp015-workspace.log 2>&1
          TESTS=$?
          cargo test --manifest-path production/Cargo.toml -p gaonn-multi-rate-coupling-core --test wp015 > /tmp/wp015-dedicated.log 2>&1
          DEDICATED=$?
          set -e
          mkdir -p docs/evidence/week1
          {
            echo "WP015_CORRECTION_CYCLE=1"
            echo "CLIPPY_EXIT=$CLIPPY"
            echo "WORKSPACE_TEST_EXIT=$TESTS"
            echo "DEDICATED_TEST_EXIT=$DEDICATED"
            echo "--- CLIPPY ---"
            cat /tmp/wp015-clippy.log
            echo "--- DEDICATED ---"
            cat /tmp/wp015-dedicated.log
          } > docs/evidence/week1/wp015-cycle1-run.txt
          if [ "$CLIPPY" -ne 0 ] || [ "$TESTS" -ne 0 ] || [ "$DEDICATED" -ne 0 ]; then
            git restore production/crates/multi-rate-coupling-core production/Cargo.lock || true
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add docs/evidence/week1/wp015-cycle1-run.txt
            git commit -m 'docs(coupling): WP-015 cycle1 diagnostic'
            git push
            exit 0
          fi
      - name: Commit validated correction
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add production/crates/multi-rate-coupling-core production/Cargo.toml production/Cargo.lock docs/evidence/week1/wp015-cycle1-run.txt
          git commit -m 'fix(coupling): WP-015 correction cycle 1'
          git push
