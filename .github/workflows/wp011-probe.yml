name: WP011 bounded validation probe

on:
  push:
    branches:
      - execution/week1-wp011-go
    paths:
      - '.github/workflows/wp011-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Strict validation probe
        shell: bash
        run: |
          set +e
          cargo fmt --manifest-path production/Cargo.toml --all -- --check > /tmp/fmt.log 2>&1
          FMT=$?
          cargo clippy --manifest-path production/Cargo.toml --workspace --all-targets -- -D warnings > /tmp/clippy.log 2>&1
          CLIPPY=$?
          cargo test --manifest-path production/Cargo.toml --workspace > /tmp/workspace.log 2>&1
          WORKSPACE=$?
          cargo test --manifest-path production/Cargo.toml -p gaonn-causal-random-core --test wp011 > /tmp/wp011.log 2>&1
          WP011=$?
          set -e
          mkdir -p docs/evidence/week1
          {
            echo "WP011_PROBE_HEAD=$(git rev-parse HEAD)"
            echo "FMT_EXIT=$FMT"
            echo "CLIPPY_EXIT=$CLIPPY"
            echo "WORKSPACE_TEST_EXIT=$WORKSPACE"
            echo "WP011_TEST_EXIT=$WP011"
            echo '--- FMT ---'
            tail -n 120 /tmp/fmt.log
            echo '--- CLIPPY ---'
            tail -n 120 /tmp/clippy.log
            echo '--- WP011 TEST ---'
            cat /tmp/wp011.log
            echo '--- WORKSPACE TEST TAIL ---'
            tail -n 120 /tmp/workspace.log
          } > docs/evidence/week1/wp011-ci-probe.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/evidence/week1/wp011-ci-probe.txt production/Cargo.lock || true
          if ! git diff --cached --quiet; then
            git commit -m 'ci(random): publish WP-011 validation probe [skip ci]'
            git push
          fi
          if [ "$FMT" -ne 0 ] || [ "$CLIPPY" -ne 0 ] || [ "$WORKSPACE" -ne 0 ] || [ "$WP011" -ne 0 ]; then exit 1; fi
