name: WP011 bounded repair cycle 2

on:
  push:
    branches:
      - execution/week1-wp011-go
    paths:
      - '.github/workflows/wp011-probe.yml'

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Preserve versioned seed history and exact lineage references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('production/crates/causal-random-core/src/lib.rs')
          s = p.read_text()
          replacements = [
              (
                  '    seeds: BTreeMap<String, VersionedWorldSeed>,',
                  '    seeds: BTreeMap<(String, u32), VersionedWorldSeed>,'
              ),
              (
'''        if self.seeds.contains_key(&seed.stable_id) {
            return Err(RandomError::DuplicateStableId(seed.stable_id));
        }
        let reference = seed.reference();
        self.seeds.insert(seed.stable_id.clone(), seed);
        Ok(reference)''',
'''        if self
            .seeds
            .keys()
            .any(|(stable_id, _)| stable_id == &seed.stable_id)
        {
            return Err(RandomError::DuplicateStableId(seed.stable_id));
        }
        let reference = seed.reference();
        self.seeds
            .insert((seed.stable_id.clone(), seed.version), seed);
        Ok(reference)'''
              ),
              (
'''        let previous = self
            .seeds
            .get(&seed.stable_id)
            .ok_or_else(|| RandomError::DanglingReference(seed.stable_id.clone()))?;
        if seed.predecessor.as_ref() != Some(&previous.reference()) {
            return Err(RandomError::ReferenceMismatch("seed.predecessor"));
        }
        let reference = seed.reference();
        self.seeds.insert(seed.stable_id.clone(), seed);
        Ok(reference)
    }

    pub fn seed(&self, stable_id: &str) -> Result<&VersionedWorldSeed, RandomError> {
        self.seeds
            .get(stable_id)
            .ok_or_else(|| RandomError::DanglingReference(stable_id.to_owned()))
    }''',
'''        let previous = self.seed(&seed.stable_id)?;
        if seed.predecessor.as_ref() != Some(&previous.reference()) {
            return Err(RandomError::ReferenceMismatch("seed.predecessor"));
        }
        let key = (seed.stable_id.clone(), seed.version);
        if self.seeds.contains_key(&key) {
            return Err(RandomError::DuplicateStableId(format!(
                "{}@{}",
                seed.stable_id, seed.version
            )));
        }
        let reference = seed.reference();
        self.seeds.insert(key, seed);
        Ok(reference)
    }

    pub fn seed(&self, stable_id: &str) -> Result<&VersionedWorldSeed, RandomError> {
        self.seeds
            .values()
            .filter(|seed| seed.stable_id == stable_id)
            .max_by_key(|seed| seed.version)
            .ok_or_else(|| RandomError::DanglingReference(stable_id.to_owned()))
    }

    pub fn seed_by_ref(&self, reference: &VersionRef) -> Result<&VersionedWorldSeed, RandomError> {
        let key = (reference.stable_id.clone(), reference.version);
        let seed = self
            .seeds
            .get(&key)
            .ok_or_else(|| RandomError::DanglingReference(format!(
                "{}@{}",
                reference.stable_id, reference.version
            )))?;
        if seed.reference() != *reference {
            return Err(RandomError::ReferenceMismatch("seed.reference"));
        }
        Ok(seed)
    }'''
              ),
              (
'''    let seed = registry.seed(&lineage.seed_ref.stable_id)?;
    if seed.reference() != lineage.seed_ref {
        return Err(RandomError::ReferenceMismatch("lineage.seed_ref"));
    }''',
'''    let seed = registry.seed_by_ref(&lineage.seed_ref)?;'''
              ),
              (
'''    let seed = registry.seed(&lineage.seed_ref.stable_id)?;
    if seed.reference() != lineage.seed_ref {
        return Err(RandomError::ReferenceMismatch("lineage.seed_ref"));
    }
    Ok(())''',
'''    registry.seed_by_ref(&lineage.seed_ref)?;
    Ok(())'''
              ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'expected source pattern not found: {old[:80]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          t = Path('production/crates/causal-random-core/tests/wp011.rs')
          ts = t.read_text()
          marker = '''#[test]
fn identity_audit_fixture_does_not_create_random_identity_shortcut() {'''
          test = '''#[test]
fn versioned_seed_history_remains_replayable_after_new_seed_version() {
    let mut reg = registry();
    let old_address = address(21);
    let old_sample = stateless_sample_u64(&reg, &old_address).unwrap();
    let old_ref = reg.seed("world-seed").unwrap().reference();

    let mut revised = seed();
    revised.version = 2;
    revised.predecessor = Some(old_ref.clone());
    revised.causal_parent = "seed:revision-2".to_owned();
    revised.root256 = [0x91, 0x92, 0x93, 0x94];
    reg.update_seed(revised, WriteOrigin::RegistryAuthority)
        .unwrap();

    assert_eq!(reg.seed("world-seed").unwrap().version, 2);
    assert_eq!(reg.seed_by_ref(&old_ref).unwrap().version, 1);
    assert_eq!(old_sample, stateless_sample_u64(&reg, &old_address).unwrap());

    let snapshot = RandomSnapshot {
        schema_version: 1,
        commit_marker: "commit:seed-history".to_owned(),
        causal_cut: "cut:seed-history".to_owned(),
        registry: reg,
    };
    let restored = snapshot.restore().unwrap();
    assert_eq!(restored.seed("world-seed").unwrap().version, 2);
    assert_eq!(restored.seed_by_ref(&old_ref).unwrap().version, 1);
    assert_eq!(
        old_sample,
        stateless_sample_u64(&restored, &old_address).unwrap()
    );
}

'''
          if marker not in ts:
              raise SystemExit('test insertion marker not found')
          if 'versioned_seed_history_remains_replayable_after_new_seed_version' not in ts:
              ts = ts.replace(marker, test + marker, 1)
          t.write_text(ts)
          PY
          cargo fmt --manifest-path production/Cargo.toml --all
      - name: Strict validation
        shell: bash
        run: |
          set +e
          cargo fmt --manifest-path production/Cargo.toml --all -- --check > /tmp/fmt.log 2>&1
          FMT=$?
          cargo clippy --manifest-path production/Cargo.toml --workspace --all-targets -- -D warnings > /tmp/clippy.log 2>&1
          CLIPPY=$?
          cargo test --manifest-path production/Cargo.toml --workspace > /tmp/workspace.log 2>&1
          WORKSPACE=$?
          cargo test --manifest-path production/Cargo.toml -p gaonn-causal-random-core --test wp011 > /tmp/wp011.log 2>&1
          WP011=$?
          set -e
          mkdir -p docs/evidence/week1
          {
            echo "WP011_REPAIR2_BASE=$(git rev-parse HEAD)"
            echo "FMT_EXIT=$FMT"
            echo "CLIPPY_EXIT=$CLIPPY"
            echo "WORKSPACE_TEST_EXIT=$WORKSPACE"
            echo "WP011_TEST_EXIT=$WP011"
            echo '--- CLIPPY ---'
            tail -n 120 /tmp/clippy.log
            echo '--- WP011 TEST ---'
            cat /tmp/wp011.log
            echo '--- WORKSPACE TEST TAIL ---'
            tail -n 120 /tmp/workspace.log
          } > docs/evidence/week1/wp011-ci-probe.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add production/crates/causal-random-core production/Cargo.lock docs/evidence/week1/wp011-ci-probe.txt || true
          if ! git diff --cached --quiet; then
            git commit -m 'fix(random): bounded WP-011 repair cycle 2 [skip ci]'
            git push
          fi
          if [ "$FMT" -ne 0 ] || [ "$CLIPPY" -ne 0 ] || [ "$WORKSPACE" -ne 0 ] || [ "$WP011" -ne 0 ]; then exit 1; fi
