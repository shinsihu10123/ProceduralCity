name: Economic Lab RV08 R4-ALAM Persistence Envelope Audit

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - '.github/workflows/economic-lab-rv08-r4-alam-persistence-envelope.yml'
      - 'economic-lab/scripts/rv08-payroll-persistence-staffing-envelope-audit-v10.mjs'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  NODE_OPTIONS: --max-old-space-size=7168

jobs:
  launch-beacon:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d '{"state":"pending","context":"economic-lab/wp-rv08-r4-alam","description":"R4-AL/AM persistence-envelope audit running","target_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

  audit:
    name: R4-ALAM ${{ matrix.state }} · ${{ matrix.seedcase }} · ${{ matrix.base }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        state: [canonical, ramp-grace]
        seedcase:
          - original-A__ECON-RV02-A
          - original-C__ECON-RV02-C
          - heldout-E__ECON-RV08-HOLDOUT-E
          - heldout-F__ECON-RV08-HOLDOUT-F
        base: [consumer, materials-consumer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run persistence and staffing-envelope audit
        working-directory: economic-lab
        env:
          STATE: ${{ matrix.state }}
          CASE: ${{ matrix.seedcase }}
          BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          LABEL="${CASE%%__*}"
          SEED="${CASE#*__}"
          mkdir -p performance-results
          DIAG_MONTHS=24 \
          DIAG_CHECK_MONTHS=6 \
          DIAG_STATES="$STATE" \
          DIAG_BASES="$BASE" \
          DIAG_SEEDS="$SEED" \
          OUTPUT_JSON="performance-results/rv08-r4-alam-${STATE}-${LABEL}-${BASE}.json" \
          node scripts/rv08-payroll-persistence-staffing-envelope-audit-v10.mjs \
          | tee "performance-results/rv08-r4-alam-${STATE}-${LABEL}-${BASE}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rv08-r4-alam-${{ matrix.state }}-${{ matrix.seedcase }}-${{ matrix.base }}
          path: |
            economic-lab/performance-results/rv08-r4-alam-*.json
            economic-lab/performance-results/rv08-r4-alam-*.log
          if-no-files-found: warn
          retention-days: 90

  final-beacon:
    if: always()
    needs: audit
    runs-on: ubuntu-24.04
    steps:
      - name: Publish final status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.audit.result }}
        run: |
          if [ "$RESULT" = "success" ]; then
            STATE=success
            DESC='R4-AL/AM persistence-envelope audit passed'
          else
            STATE=failure
            DESC="R4-AL/AM incomplete: $RESULT"
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{\"state\":\"$STATE\",\"context\":\"economic-lab/wp-rv08-r4-alam\",\"description\":\"$DESC\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
