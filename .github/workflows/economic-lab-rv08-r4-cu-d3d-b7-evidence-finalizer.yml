name: Economic Lab RV08 R4-CU-D3D-B7 Evidence Finalizer

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - '.github/workflows/economic-lab-rv08-r4-cu-d3d-b7-evidence-finalizer.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  persist-authoritative-evidence:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_BRANCH: scratch/new-project-2026-08-12
      SOURCE_RUN_ID: '33371200438'
      SOURCE_HEAD_SHA: 9bed96f445e87765431235c9ff7908bf73668e07
      SOURCE_WORKFLOW_PATH: .github/workflows/economic-lab-rv08-r4-cu-d3d-b7-demand-inventory-topology.yml
      ARTIFACT_NAME: r4-cu-d3d-b7-authoritative-aggregate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scratch/new-project-2026-08-12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frozen B7 dependency and scripts
        run: |
          node --check economic-lab/scripts/rv08-r4-cu-d3d-b7-aggregate.mjs
          node --check economic-lab/scripts/rv08-r4-cu-d3d-b7-closure.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const x = JSON.parse(fs.readFileSync('economic-lab/diagnostics/reality-validation/r4-cu-d3d-b7-demand-inventory-topology-contract.json', 'utf8'));
          assert.equal(x.front, 'R4-CU-D3D-B7');
          assert.equal(x.status, 'FROZEN_BEFORE_DIAGNOSTIC_EXECUTION');
          assert.equal(x.sourceStage3.decision, 'LONG_HORIZON_OR_STRESS_VALIDATION_FAILED_NO_RETUNING');
          assert.equal(x.sourceStage3.primaryCandidateId, 'V24_M16_C42');
          assert.equal(x.sourceStage3.candidateRetuningAuthorized, false);
          assert.equal(x.sourceStage3.thresholdRelaxationAuthorized, false);
          assert.equal(x.execution.candidateSeedScenarioJobs, 12);
          assert.equal(x.execution.months, 36);
          assert.equal(x.diagnosticContract.worldStateMutationAuthorized, false);
          assert.equal(x.diagnosticContract.canonicalSourceMutationAuthorized, false);
          assert.equal(x.diagnosticContract.candidateValueMutationAuthorized, false);
          assert.equal(x.diagnosticContract.scenarioMutationAuthorized, false);
          assert.equal(x.canonicalMutationAuthorized, false);
          assert.equal(x.directParameterCalibrationAuthorized, false);
          NODE
      - name: Verify authoritative B7 run identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          test "$(jq -r '.status' <<<"$RUN_JSON")" = 'completed'
          test "$(jq -r '.conclusion' <<<"$RUN_JSON")" = 'success'
          test "$(jq -r '.head_sha' <<<"$RUN_JSON")" = "$SOURCE_HEAD_SHA"
          test "$(jq -r '.path' <<<"$RUN_JSON")" = "$SOURCE_WORKFLOW_PATH"
          RUN_URL="$(jq -r '.html_url' <<<"$RUN_JSON")"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"
      - name: Download authoritative aggregate
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts")"
          ARTIFACT_ID="$(jq -r --arg name "$ARTIFACT_NAME" '.artifacts[] | select(.name == $name and .expired == false) | .id' <<<"$ARTIFACT_JSON" | head -n 1)"
          ARTIFACT_DIGEST="$(jq -r --arg name "$ARTIFACT_NAME" '.artifacts[] | select(.name == $name and .expired == false) | (.digest // "UNKNOWN")' <<<"$ARTIFACT_JSON" | head -n 1)"
          test -n "$ARTIFACT_ID"
          mkdir -p downloaded-b7/unpacked economic-lab/diagnostics/reality-validation/evidence
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > downloaded-b7/aggregate.zip
          unzip -q downloaded-b7/aggregate.zip -d downloaded-b7/unpacked
          AGGREGATE="$(find downloaded-b7/unpacked -type f -name 'r4-cu-d3d-b7-aggregate.json' | head -n 1)"
          SUMMARY="$(find downloaded-b7/unpacked -type f -name 'r4-cu-d3d-b7-summary.md' | head -n 1)"
          test -n "$AGGREGATE"
          test -n "$SUMMARY"
          cp "$AGGREGATE" economic-lab/diagnostics/reality-validation/evidence/r4-cu-d3d-b7-authoritative-aggregate.json
          cp "$SUMMARY" economic-lab/diagnostics/reality-validation/evidence/r4-cu-d3d-b7-authoritative-summary.md
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Validate decision and generate Closure
        env:
          SOURCE_RUN_URL: ${{ steps.source.outputs.run_url }}
          SOURCE_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const x = JSON.parse(fs.readFileSync('economic-lab/diagnostics/reality-validation/evidence/r4-cu-d3d-b7-authoritative-aggregate.json', 'utf8'));
          assert.equal(x.status, 'PASS_TECHNICAL_B7_DIAGNOSTIC_AGGREGATION');
          assert.equal(x.decision, 'MIXED');
          assert.deepEqual(x.dominantPrimaryLabels, ['INPUT_SUPPLIER_TOPOLOGY_BINDING', 'VALUE_TRANSFORMATION_BINDING']);
          assert.equal(x.routing, 'R4-CU-D3D-B7-D0 sequenced multi-mechanism causal preregistration');
          assert.equal(x.observed.jobs, 12);
          assert.equal(x.technicalGates.ok, true);
          assert.equal(x.interpretation.candidateRetuningAuthorized, false);
          assert.equal(x.interpretation.canonicalMutationAuthorized, false);
          NODE
          SOURCE_RUN_ID="$SOURCE_RUN_ID" \
          SOURCE_HEAD_SHA="$SOURCE_HEAD_SHA" \
          SOURCE_RUN_URL="$SOURCE_RUN_URL" \
          SOURCE_ARTIFACT_ID="$SOURCE_ARTIFACT_ID" \
          SOURCE_ARTIFACT_DIGEST="$SOURCE_ARTIFACT_DIGEST" \
          node economic-lab/scripts/rv08-r4-cu-d3d-b7-closure.mjs \
            economic-lab/diagnostics/reality-validation/evidence/r4-cu-d3d-b7-authoritative-aggregate.json \
            economic-lab/diagnostics/reality-validation/WP-RV08_R4_CU_D3D_B7_CLOSURE_v0.1.md
      - name: Persist authoritative evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            economic-lab/diagnostics/reality-validation/evidence/r4-cu-d3d-b7-authoritative-aggregate.json \
            economic-lab/diagnostics/reality-validation/evidence/r4-cu-d3d-b7-authoritative-summary.md \
            economic-lab/diagnostics/reality-validation/WP-RV08_R4_CU_D3D_B7_CLOSURE_v0.1.md
          if git diff --cached --quiet; then
            echo 'Authoritative B7 evidence is already persisted.'
            exit 0
          fi
          git commit -m 'docs(econ): close R4-CU-D3D-B7 MIXED route D0'
          git pull --rebase origin "$SOURCE_BRANCH"
          git push origin "HEAD:$SOURCE_BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: r4-cu-d3d-b7-persisted-evidence
          path: |
            economic-lab/diagnostics/reality-validation/evidence/r4-cu-d3d-b7-authoritative-aggregate.json
            economic-lab/diagnostics/reality-validation/evidence/r4-cu-d3d-b7-authoritative-summary.md
            economic-lab/diagnostics/reality-validation/WP-RV08_R4_CU_D3D_B7_CLOSURE_v0.1.md
          retention-days: 90
      - name: Final beacon
        run: echo 'R4-CU-D3D-B7 authoritative evidence persisted'
