name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - execution/controller-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-site

      - name: Checkout Economic Lab 3D Observer
        uses: actions/checkout@v4
        with:
          ref: feature/economic-lab-3d-observer-v1
          path: observer-source

      - name: Checkout execution dashboard source
        uses: actions/checkout@v4
        with:
          ref: execution/controller-v1
          path: execution-source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate independent V3 runtime
        working-directory: main-site
        run: npm test

      - name: Install Economic Lab dependencies
        working-directory: observer-source/economic-lab
        run: npm install

      - name: Validate Economic Lab 3D observer bridge
        working-directory: observer-source/economic-lab
        run: npm run test:observer

      - name: Build Economic Lab 3D observer for Pages subpath
        working-directory: observer-source/economic-lab
        run: npx vite build --base=/ProceduralCity/economic-lab/

      - name: Validate dashboard static sources
        run: |
          test -f execution-source/execution-dashboard/index.html
          test -f execution-source/execution-dashboard/app.css
          test -f execution-source/execution-dashboard/app.js
          python execution-source/production/execution/controller.py validate
          python execution-source/production/execution/controller.py dry-run

      - name: Compose Pages artifact
        run: |
          mkdir -p pages-artifact
          rsync -a --exclude='.git' --exclude='.github' --exclude='economic-lab' main-site/ pages-artifact/
          mkdir -p pages-artifact/economic-lab
          cp -a observer-source/economic-lab/dist/. pages-artifact/economic-lab/
          cp observer-source/economic-lab/legacy.html pages-artifact/economic-lab/legacy.html
          cp -a observer-source/economic-lab/src pages-artifact/economic-lab/src
          mkdir -p pages-artifact/execution-dashboard/data
          cp -a execution-source/execution-dashboard/. pages-artifact/execution-dashboard/
          cp execution-source/production/execution/STATE.json pages-artifact/execution-dashboard/data/STATE.json
          cp execution-source/production/execution/DRY_RUN.json pages-artifact/execution-dashboard/data/DRY_RUN.json
          cp execution-source/production/execution/WP_LEDGER.jsonl pages-artifact/execution-dashboard/data/WP_LEDGER.jsonl
          touch pages-artifact/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  record-execution-dashboard-deployment:
    if: github.ref == 'refs/heads/execution/controller-v1'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout controller branch
        uses: actions/checkout@v4
        with:
          ref: execution/controller-v1
          fetch-depth: 1

      - name: Record successful Pages deployment receipt
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          receipt = {
              "schema_version": "1.0.0",
              "status": "SUCCESS",
              "workflow": "Deploy to GitHub Pages",
              "run_id": int(os.environ["RUN_ID"]),
              "source_sha": os.environ["SOURCE_SHA"],
              "page_url": os.environ["PAGE_URL"],
              "dashboard_path": "execution-dashboard/",
              "deployed_at": datetime.now(timezone.utc).isoformat(),
          }
          path = Path("production/execution/PAGES_DEPLOYMENT.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/execution/PAGES_DEPLOYMENT.json
          if git diff --cached --quiet; then
            echo "Deployment receipt already current"
          else
            git commit -m "execution: record Pages deployment receipt [skip ci]"
            git push origin HEAD:execution/controller-v1
          fi
