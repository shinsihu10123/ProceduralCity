name: Economic Lab RV08 R4-E Accounting Visible

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - .github/workflows/economic-lab-rv08-r4e-visible.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  NODE_OPTIONS: --max-old-space-size=6144
  DIAG_MONTHS: '24'
  DIAG_SEEDS: ECON-RV02-A,ECON-RV02-B,ECON-RV02-C

jobs:
  nia:
    name: R4-E1 NIA composition
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DIAG_SCALE: baseline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Pending beacon
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' >/tmp/s.json
          import json,os; print(json.dumps({'state':'pending','target_url':os.environ['RUN_URL'],'description':'RV08 R4-E1 NIA audit running','context':'economic-lab/wp-rv08-r4-e1'}))
          PY
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" --data-binary @/tmp/s.json
      - name: Run audit
        working-directory: economic-lab
        env:
          OUTPUT_JSON: performance-results/rv08-r4-e1-nia-24m.json
        run: |
          set -o pipefail
          mkdir -p performance-results
          node scripts/nia-composition-diagnosis-v10.mjs | tee performance-results/rv08-r4-e1.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economic-lab-wp-rv08-r4-e1-visible
          path: |
            economic-lab/performance-results/rv08-r4-e1-nia-24m.json
            economic-lab/performance-results/rv08-r4-e1.log
          retention-days: 30
      - name: Final beacon
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          python - <<'PY' >/tmp/s.json
          import json,os; print(json.dumps({'state':os.environ['API_STATE'],'target_url':os.environ['RUN_URL'],'description':'RV08 R4-E1 NIA audit finished','context':'economic-lab/wp-rv08-r4-e1'}))
          PY
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" --data-binary @/tmp/s.json

  orphan:
    name: R4-E2 orphan inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DIAG_SCALE: baseline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Pending beacon
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' >/tmp/s.json
          import json,os; print(json.dumps({'state':'pending','target_url':os.environ['RUN_URL'],'description':'RV08 R4-E2 orphan inventory running','context':'economic-lab/wp-rv08-r4-e2'}))
          PY
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" --data-binary @/tmp/s.json
      - name: Run audit
        working-directory: economic-lab
        env:
          OUTPUT_JSON: performance-results/rv08-r4-e2-orphan-24m.json
        run: |
          set -o pipefail
          mkdir -p performance-results
          node scripts/nia-orphan-inventory-probe-v10.mjs | tee performance-results/rv08-r4-e2.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economic-lab-wp-rv08-r4-e2-visible
          path: |
            economic-lab/performance-results/rv08-r4-e2-orphan-24m.json
            economic-lab/performance-results/rv08-r4-e2.log
          retention-days: 30
      - name: Final beacon
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          python - <<'PY' >/tmp/s.json
          import json,os; print(json.dumps({'state':os.environ['API_STATE'],'target_url':os.environ['RUN_URL'],'description':'RV08 R4-E2 orphan inventory finished','context':'economic-lab/wp-rv08-r4-e2'}))
          PY
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" --data-binary @/tmp/s.json

  runoff:
    name: R4-E3 physical runoff
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DIAG_SCALES: compact,baseline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Pending beacon
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' >/tmp/s.json
          import json,os; print(json.dumps({'state':'pending','target_url':os.environ['RUN_URL'],'description':'RV08 R4-E3 physical runoff running','context':'economic-lab/wp-rv08-r4-e3'}))
          PY
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" --data-binary @/tmp/s.json
      - name: Run audit
        working-directory: economic-lab
        env:
          OUTPUT_JSON: performance-results/rv08-r4-e3-runoff-24m.json
        run: |
          set -o pipefail
          mkdir -p performance-results
          node scripts/finished-goods-inventory-runoff-audit-v10.mjs | tee performance-results/rv08-r4-e3.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economic-lab-wp-rv08-r4-e3-visible
          path: |
            economic-lab/performance-results/rv08-r4-e3-runoff-24m.json
            economic-lab/performance-results/rv08-r4-e3.log
          retention-days: 30
      - name: Final beacon
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          python - <<'PY' >/tmp/s.json
          import json,os; print(json.dumps({'state':os.environ['API_STATE'],'target_url':os.environ['RUN_URL'],'description':'RV08 R4-E3 physical runoff finished','context':'economic-lab/wp-rv08-r4-e3'}))
          PY
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" --data-binary @/tmp/s.json
