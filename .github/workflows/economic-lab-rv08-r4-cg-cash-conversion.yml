name: Economic Lab RV08 R4-CG Cash Conversion Gate

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - 'economic-lab/scripts/rv08-r4-cg-operating-cash-conversion-v10.mjs'
      - '.github/workflows/economic-lab-rv08-r4-cg-cash-conversion.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  launch-beacon:
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'R4-CG launched'

  r4-cg:
    needs: launch-beacon
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        case:
          - original-A__ECON-RV02-A
          - original-C__ECON-RV02-C
          - heldout-E__ECON-RV08-HOLDOUT-E
          - heldout-F__ECON-RV08-HOLDOUT-F
    name: R4-CG ${{ matrix.case }}
    env:
      NODE_OPTIONS: --max-old-space-size=7168
      CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax gate
        working-directory: economic-lab
        run: node --check scripts/rv08-r4-cg-operating-cash-conversion-v10.mjs
      - name: Run 24-month cash-conversion decomposition
        working-directory: economic-lab
        run: |
          set -o pipefail
          LABEL="${CASE%%__*}"
          SEED="${CASE#*__}"
          mkdir -p performance-results
          DIAG_SEED="$SEED" DIAG_MONTHS=24 \
          OUTPUT_JSON="performance-results/r4-cg-${LABEL}.json" \
          node scripts/rv08-r4-cg-operating-cash-conversion-v10.mjs \
          2>&1 | tee "performance-results/r4-cg-${LABEL}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-cg-${{ matrix.case }}
          path: economic-lab/performance-results/r4-cg-*
          retention-days: 90

  final-beacon:
    needs: r4-cg
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'R4-CG matrix completed'
