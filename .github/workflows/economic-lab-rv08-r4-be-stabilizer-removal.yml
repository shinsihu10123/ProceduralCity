name: Economic Lab RV08 R4-BE Stabilizer Removal

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - '.github/workflows/economic-lab-rv08-r4-be-stabilizer-removal.yml'
      - 'economic-lab/scripts/rv08-stabilizer-removal-ablation-v10.mjs'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  NODE_OPTIONS: --max-old-space-size=7168

jobs:
  launch-beacon:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d '{"state":"pending","context":"economic-lab/wp-rv08-r4-be","description":"R4-BE stabilizer removal ablation running","target_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

  audit:
    name: R4-BE ${{ matrix.seedcase }} · ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        seedcase:
          - original-A__ECON-RV02-A
          - original-C__ECON-RV02-C
          - heldout-E__ECON-RV08-HOLDOUT-E
          - heldout-F__ECON-RV08-HOLDOUT-F
        variant:
          - control
          - no-transfers
          - no-government-demand
          - no-new-credit
          - no-fiscal-stabilizers
          - no-stabilizers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run stabilizer removal ablation
        working-directory: economic-lab
        env:
          CASE: ${{ matrix.seedcase }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          LABEL="${CASE%%__*}"
          SEED="${CASE#*__}"
          mkdir -p performance-results
          DIAG_SEED="$SEED" \
          DIAG_VARIANT="$VARIANT" \
          DIAG_MONTHS=36 \
          OUTPUT_JSON="performance-results/rv08-r4-be-${LABEL}-${VARIANT}.json" \
          node scripts/rv08-stabilizer-removal-ablation-v10.mjs \
          | tee "performance-results/rv08-r4-be-${LABEL}-${VARIANT}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rv08-r4-be-${{ matrix.seedcase }}-${{ matrix.variant }}
          path: |
            economic-lab/performance-results/rv08-r4-be-*.json
            economic-lab/performance-results/rv08-r4-be-*.log
          if-no-files-found: warn
          retention-days: 90

  final-beacon:
    if: always()
    needs: audit
    runs-on: ubuntu-24.04
    steps:
      - name: Publish final status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.audit.result }}
        run: |
          if [ "$RESULT" = "success" ]; then
            STATE=success
            DESC='R4-BE stabilizer removal ablation passed'
          else
            STATE=failure
            DESC="R4-BE incomplete: $RESULT"
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{\"state\":\"$STATE\",\"context\":\"economic-lab/wp-rv08-r4-be\",\"description\":\"$DESC\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
