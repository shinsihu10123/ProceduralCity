name: One-time Clippy fix S1.01.08

on:
  push:
    branches:
      - execution/week1-wp001-s1-01-01

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: execution/week1-wp001-s1-01-01

      - name: Fix and commit once
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$COMMIT_MESSAGE" = "fix(world-core): resolve S1.01.08 clippy" ]; then
            echo "Clippy-fix commit observed; nothing to do."
            exit 0
          fi
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          cargo clippy --manifest-path production/Cargo.toml --workspace --all-targets --fix --allow-dirty --allow-staged -- -D warnings
          cargo fmt --manifest-path production/Cargo.toml --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/crates/world-core/src/acceptance.rs production/crates/world-core/tests/s1_01_08_acceptance_review.rs
          if git diff --cached --quiet; then
            echo "No Clippy changes required"
            exit 0
          fi
          git commit -m "fix(world-core): resolve S1.01.08 clippy"
          git push origin HEAD:execution/week1-wp001-s1-01-01
