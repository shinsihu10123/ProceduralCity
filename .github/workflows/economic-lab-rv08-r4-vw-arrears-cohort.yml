name: Economic Lab RV08 R4-VW Arrears Cohort

on:
  workflow_dispatch:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - .github/workflows/economic-lab-rv08-r4-vw-arrears-cohort.yml
      - economic-lab/scripts/rv08-restructure-arrears-cohort-audit-v10.mjs

concurrency:
  group: economic-lab-rv08-r4-vw-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

env:
  NODE_OPTIONS: --max-old-space-size=7168

jobs:
  launch-beacon:
    name: VW launch beacon
    runs-on: ubuntu-24.04
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' >/tmp/status.json
          import json,os
          print(json.dumps({'state':'pending','target_url':os.environ['RUN_URL'],'description':'RV08 R4-VW 12-job arrears cohort batch running','context':'economic-lab/wp-rv08-r4-vw'}))
          PY
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" --data-binary @/tmp/status.json

  v-original-24m:
    name: R4-V original 24m ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { id: A, seed: ECON-RV02-A }
          - { id: B, seed: ECON-RV02-B }
          - { id: C, seed: ECON-RV02-C }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run R4-V original cohort audit
        working-directory: economic-lab
        env:
          DIAG_TRACK: V
          DIAG_MONTHS: '24'
          DIAG_SCALES: baseline
          DIAG_SEEDS: ${{ matrix.seed }}
          OUTPUT_JSON: performance-results/rv08-r4-v-original-${{ matrix.id }}.json
        run: |
          set -o pipefail
          mkdir -p performance-results
          node scripts/rv08-restructure-arrears-cohort-audit-v10.mjs | tee performance-results/rv08-r4-v-original-${{ matrix.id }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economic-lab-wp-rv08-r4-v-original-${{ matrix.id }}
          path: |
            economic-lab/performance-results/rv08-r4-v-original-${{ matrix.id }}.json
            economic-lab/performance-results/rv08-r4-v-original-${{ matrix.id }}.log
          retention-days: 30
          if-no-files-found: warn

  v-heldout-24m:
    name: R4-V held-out 24m ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { id: D, seed: ECON-RV08-HOLDOUT-D }
          - { id: E, seed: ECON-RV08-HOLDOUT-E }
          - { id: F, seed: ECON-RV08-HOLDOUT-F }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run R4-V held-out cohort audit
        working-directory: economic-lab
        env:
          DIAG_TRACK: V
          DIAG_MONTHS: '24'
          DIAG_SCALES: baseline
          DIAG_SEEDS: ${{ matrix.seed }}
          OUTPUT_JSON: performance-results/rv08-r4-v-heldout-${{ matrix.id }}.json
        run: |
          set -o pipefail
          mkdir -p performance-results
          node scripts/rv08-restructure-arrears-cohort-audit-v10.mjs | tee performance-results/rv08-r4-v-heldout-${{ matrix.id }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economic-lab-wp-rv08-r4-v-heldout-${{ matrix.id }}
          path: |
            economic-lab/performance-results/rv08-r4-v-heldout-${{ matrix.id }}.json
            economic-lab/performance-results/rv08-r4-v-heldout-${{ matrix.id }}.log
          retention-days: 30
          if-no-files-found: warn

  w-original-48m:
    name: R4-W original 48m ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { id: A, seed: ECON-RV02-A }
          - { id: B, seed: ECON-RV02-B }
          - { id: C, seed: ECON-RV02-C }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run R4-W original persistence audit
        working-directory: economic-lab
        env:
          DIAG_TRACK: W
          DIAG_MONTHS: '48'
          DIAG_SCALES: baseline
          DIAG_SEEDS: ${{ matrix.seed }}
          OUTPUT_JSON: performance-results/rv08-r4-w-original-${{ matrix.id }}.json
        run: |
          set -o pipefail
          mkdir -p performance-results
          node scripts/rv08-restructure-arrears-cohort-audit-v10.mjs | tee performance-results/rv08-r4-w-original-${{ matrix.id }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economic-lab-wp-rv08-r4-w-original-${{ matrix.id }}
          path: |
            economic-lab/performance-results/rv08-r4-w-original-${{ matrix.id }}.json
            economic-lab/performance-results/rv08-r4-w-original-${{ matrix.id }}.log
          retention-days: 30
          if-no-files-found: warn

  w-heldout-48m:
    name: R4-W held-out 48m ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { id: D, seed: ECON-RV08-HOLDOUT-D }
          - { id: E, seed: ECON-RV08-HOLDOUT-E }
          - { id: F, seed: ECON-RV08-HOLDOUT-F }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run R4-W held-out persistence audit
        working-directory: economic-lab
        env:
          DIAG_TRACK: W
          DIAG_MONTHS: '48'
          DIAG_SCALES: baseline
          DIAG_SEEDS: ${{ matrix.seed }}
          OUTPUT_JSON: performance-results/rv08-r4-w-heldout-${{ matrix.id }}.json
        run: |
          set -o pipefail
          mkdir -p performance-results
          node scripts/rv08-restructure-arrears-cohort-audit-v10.mjs | tee performance-results/rv08-r4-w-heldout-${{ matrix.id }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economic-lab-wp-rv08-r4-w-heldout-${{ matrix.id }}
          path: |
            economic-lab/performance-results/rv08-r4-w-heldout-${{ matrix.id }}.json
            economic-lab/performance-results/rv08-r4-w-heldout-${{ matrix.id }}.log
          retention-days: 30
          if-no-files-found: warn

  final-beacon:
    name: VW final beacon
    if: always()
    needs:
      - v-original-24m
      - v-heldout-24m
      - w-original-48m
      - w-heldout-48m
    runs-on: ubuntu-24.04
    steps:
      - name: Publish final status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          V1: ${{ needs.v-original-24m.result }}
          V2: ${{ needs.v-heldout-24m.result }}
          W1: ${{ needs.w-original-48m.result }}
          W2: ${{ needs.w-heldout-48m.result }}
        run: |
          python - <<'PY' >/tmp/status.json
          import json,os
          rs=[os.environ[k] for k in ['V1','V2','W1','W2']]
          state='success' if all(x=='success' for x in rs) else 'failure'
          print(json.dumps({'state':state,'target_url':os.environ['RUN_URL'],'description':('RV08 R4-VW finished: '+','.join(rs))[:140],'context':'economic-lab/wp-rv08-r4-vw'}))
          PY
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" --data-binary @/tmp/status.json
