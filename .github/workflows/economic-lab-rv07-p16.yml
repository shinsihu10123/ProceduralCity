name: Economic Lab WP-RV07-P16 Payroll Working-Capital Audit

on:
  workflow_dispatch:
  push:
    branches: [scratch/new-project-2026-08-12]
    paths:
      - 'economic-lab/scripts/payroll-working-capital-path-diagnosis-v10.mjs'
      - 'economic-lab/diagnostics/reality-validation/WP-RV07_P16_EXECUTION.md'
      - '.github/workflows/economic-lab-rv07-p16.yml'

permissions:
  contents: read
  statuses: write

jobs:
  diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish WP-RV07-P16 running beacon
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' > /tmp/rv07p16-running.json
          import json, os
          print(json.dumps({"state":"pending","target_url":os.environ["RUN_URL"],"description":"WP-RV07-P16 payroll working-capital audit is running","context":"economic-lab/wp-rv07-p16"}))
          PY
          curl -fsS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" --data-binary @/tmp/rv07p16-running.json
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run payroll working-capital path diagnosis
        working-directory: economic-lab
        env:
          DIAG_SCALES: compact,baseline
          DIAG_MONTHS: 12
          DIAG_SEEDS: ECON-RV02-A,ECON-RV02-B,ECON-RV02-C
          OUTPUT_JSON: performance-results/reality-diagnostics-rv07-p16-payroll-working-capital.json
        run: |
          set -euo pipefail
          node scripts/payroll-working-capital-path-diagnosis-v10.mjs
      - name: Upload WP-RV07-P16 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economic-lab-wp-rv07-p16
          path: economic-lab/performance-results/reality-diagnostics-rv07-p16-payroll-working-capital.json
          retention-days: 30
      - name: Publish WP-RV07-P16 final beacon
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESCRIPTION: ${{ job.status == 'success' && 'WP-RV07-P16 payroll audit passed hard gates' || 'WP-RV07-P16 payroll audit failed' }}
        run: |
          python - <<'PY' > /tmp/rv07p16-final.json
          import json, os
          print(json.dumps({"state":os.environ["API_STATE"],"target_url":os.environ["RUN_URL"],"description":os.environ["DESCRIPTION"],"context":"economic-lab/wp-rv07-p16"}))
          PY
          curl -fsS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" --data-binary @/tmp/rv07p16-final.json
