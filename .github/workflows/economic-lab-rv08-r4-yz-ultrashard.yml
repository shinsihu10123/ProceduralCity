name: Economic Lab RV08 R4-YZ Ultra-Sharded Labor Coherence

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - '.github/workflows/economic-lab-rv08-r4-yz-ultrashard.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: economic-lab-rv08-r4-yz-ultrashard-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=7168

jobs:
  launch-beacon:
    name: YZ ultra-shard launch beacon
    runs-on: ubuntu-24.04
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d '{"state":"pending","context":"economic-lab/wp-rv08-r4-yz-ultrashard","description":"R4-Y/Z ultra-sharded labor coherence diagnostics running","target_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

  r4-y:
    name: R4-Y 24m ${{ matrix.seedcase }} · ${{ matrix.base }} · ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seedcase:
          - original-A__ECON-RV02-A
          - original-B__ECON-RV02-B
          - original-C__ECON-RV02-C
          - heldout-D__ECON-RV08-HOLDOUT-D
          - heldout-E__ECON-RV08-HOLDOUT-E
          - heldout-F__ECON-RV08-HOLDOUT-F
        base: [consumer, materials-consumer]
        variant: [control, production, settlement, realized, hybrid]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run one canonical labor-coherence regime
        working-directory: economic-lab
        env:
          CASE: ${{ matrix.seedcase }}
          BASE: ${{ matrix.base }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          LABEL="${CASE%%__*}"
          SEED="${CASE#*__}"
          mkdir -p performance-results
          cp scripts/rv08-labor-demand-coherence-ablation-v10.mjs scripts/.rv08-labor-demand-coherence-shard.mjs
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('scripts/.rv08-labor-demand-coherence-shard.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const bases=['consumer','materials-consumer'];", "const bases=[%r];" % os.environ['BASE'])
          s=s.replace("const variants=['control','production','settlement','realized','hybrid'];", "const variants=[%r];" % os.environ['VARIANT'])
          p.write_text(s,encoding='utf-8')
          PY
          DIAG_MODE=canonical \
          DIAG_MONTHS=24 \
          DIAG_SCALES=baseline \
          DIAG_SEEDS="$SEED" \
          OUTPUT_JSON="performance-results/rv08-r4-y-${LABEL}-${BASE}-${VARIANT}.json" \
          node scripts/.rv08-labor-demand-coherence-shard.mjs \
          | tee "performance-results/rv08-r4-y-${LABEL}-${BASE}-${VARIANT}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rv08-r4-y-${{ matrix.seedcase }}-${{ matrix.base }}-${{ matrix.variant }}
          path: |
            economic-lab/performance-results/rv08-r4-y-*.json
            economic-lab/performance-results/rv08-r4-y-*.log
          if-no-files-found: warn
          retention-days: 90

  r4-z:
    name: R4-Z 36m ${{ matrix.seedcase }} · ${{ matrix.base }} · ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seedcase:
          - original-A__ECON-RV02-A
          - original-B__ECON-RV02-B
          - original-C__ECON-RV02-C
          - heldout-D__ECON-RV08-HOLDOUT-D
          - heldout-E__ECON-RV08-HOLDOUT-E
          - heldout-F__ECON-RV08-HOLDOUT-F
        base: [consumer, materials-consumer]
        variant: [control, production, settlement, realized, hybrid]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run one restructuring labor-coherence regime
        working-directory: economic-lab
        env:
          CASE: ${{ matrix.seedcase }}
          BASE: ${{ matrix.base }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          LABEL="${CASE%%__*}"
          SEED="${CASE#*__}"
          mkdir -p performance-results
          cp scripts/rv08-labor-demand-coherence-ablation-v10.mjs scripts/.rv08-labor-demand-coherence-shard.mjs
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('scripts/.rv08-labor-demand-coherence-shard.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const bases=['consumer','materials-consumer'];", "const bases=[%r];" % os.environ['BASE'])
          s=s.replace("const variants=['control','production','settlement','realized','hybrid'];", "const variants=[%r];" % os.environ['VARIANT'])
          p.write_text(s,encoding='utf-8')
          PY
          DIAG_MODE=restructure \
          DIAG_MONTHS=36 \
          DIAG_SCALES=baseline \
          DIAG_SEEDS="$SEED" \
          OUTPUT_JSON="performance-results/rv08-r4-z-${LABEL}-${BASE}-${VARIANT}.json" \
          node scripts/.rv08-labor-demand-coherence-shard.mjs \
          | tee "performance-results/rv08-r4-z-${LABEL}-${BASE}-${VARIANT}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rv08-r4-z-${{ matrix.seedcase }}-${{ matrix.base }}-${{ matrix.variant }}
          path: |
            economic-lab/performance-results/rv08-r4-z-*.json
            economic-lab/performance-results/rv08-r4-z-*.log
          if-no-files-found: warn
          retention-days: 90

  final-beacon:
    name: YZ ultra-shard final beacon
    if: always()
    needs: [r4-y, r4-z]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish final status
        env:
          GH_TOKEN: ${{ github.token }}
          Y_RESULT: ${{ needs.r4-y.result }}
          Z_RESULT: ${{ needs.r4-z.result }}
        run: |
          if [ "$Y_RESULT" = "success" ] && [ "$Z_RESULT" = "success" ]; then
            STATE=success
            DESC='R4-Y/Z ultra-sharded labor coherence diagnostics passed'
          else
            STATE=failure
            DESC="R4-Y/Z ultra-shard incomplete: Y=$Y_RESULT Z=$Z_RESULT"
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{\"state\":\"$STATE\",\"context\":\"economic-lab/wp-rv08-r4-yz-ultrashard\",\"description\":\"$DESC\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
