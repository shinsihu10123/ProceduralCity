name: Economic Lab WP-RV04 Firm Exit Attribution

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - 'economic-lab/scripts/firm-exit-diagnosis-v10.mjs'
      - 'economic-lab/diagnostics/reality-validation/WP-RV04_EXECUTION.md'
      - '.github/workflows/economic-lab-rv04.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Publish WP-RV04 running beacon
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' > /tmp/rv04-running.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "target_url": os.environ["RUN_URL"],
              "description": "WP-RV04 firm exit attribution is running",
              "context": "economic-lab/wp-rv04"
          }))
          PY
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/rv04-running.json
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run promoted 3-seed baseline firm-exit attribution
        working-directory: economic-lab
        env:
          DIAG_SCALE: 'baseline'
          DIAG_MONTHS: '12'
          DIAG_SEEDS: 'ECON-RV02-A,ECON-RV02-B,ECON-RV02-C'
          OUTPUT_JSON: 'performance-results/reality-diagnostics-rv04-firm-exits.json'
        run: node scripts/firm-exit-diagnosis-v10.mjs
      - name: Upload WP-RV04 evidence
        uses: actions/upload-artifact@v4
        with:
          name: economic-lab-wp-rv04
          path: economic-lab/performance-results/reality-diagnostics-rv04-firm-exits.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish WP-RV04 final beacon
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESCRIPTION: ${{ job.status == 'success' && 'WP-RV04 firm exit attribution passed' || 'WP-RV04 firm exit attribution failed' }}
        run: |
          python - <<'PY' > /tmp/rv04-final.json
          import json, os
          print(json.dumps({
              "state": os.environ["API_STATE"],
              "target_url": os.environ["RUN_URL"],
              "description": os.environ["DESCRIPTION"],
              "context": "economic-lab/wp-rv04"
          }))
          PY
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/rv04-final.json
