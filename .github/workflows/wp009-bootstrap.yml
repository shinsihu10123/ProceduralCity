name: WP009 Bootstrap

on:
  push:
    branches:
      - execution/week1-wp009-authority-placement

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Materialize frozen WP-009 implementation
        env:
          LIB_B64: 
          TEST_B64: 
        run: |
          python - <<'PY'
          import os,base64,gzip,pathlib
          root=pathlib.Path('.')
          crate=root/'production/crates/authority-placement-core'
          (crate/'src').mkdir(parents=True,exist_ok=True)
          (crate/'tests').mkdir(parents=True,exist_ok=True)
          (crate/'src/lib.rs').write_bytes(gzip.decompress(base64.b64decode(os.environ['LIB_B64'])))
          (crate/'tests/wp009.rs').write_bytes(gzip.decompress(base64.b64decode(os.environ['TEST_B64'])))
          (crate/'Cargo.toml').write_text('[package]\nname = "gaonn-authority-placement-core"\nversion = "0.1.0"\nedition = "2021"\n\n[dependencies]\ngaonn-identity-acceptance-core = { path = "../identity-acceptance-core" }\n')
          manifest=root/'production/Cargo.toml'
          text=manifest.read_text()
          needle='    "crates/causal-random-core",\n]'
          if 'crates/authority-placement-core' not in text:
              text=text.replace(needle,'    "crates/causal-random-core",\n    "crates/authority-placement-core",\n]')
          manifest.write_text(text)
          PY
      - name: Canonical Rust formatting
        run: cargo fmt --manifest-path production/Cargo.toml --all
      - name: Strict Clippy
        run: cargo clippy --manifest-path production/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Full workspace tests
        run: cargo test --manifest-path production/Cargo.toml --workspace
      - name: Commit validated implementation
        run: |
          rm .github/workflows/wp009-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/Cargo.toml production/Cargo.lock production/crates/authority-placement-core .github/workflows/wp009-bootstrap.yml
          git commit -m "feat(authority-placement): implement frozen WP-009"
          git push origin HEAD:execution/week1-wp009-authority-placement
