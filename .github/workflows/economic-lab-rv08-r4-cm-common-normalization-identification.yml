name: Economic Lab RV08 R4-CM Common Normalization Identification Gate
on:
  push:
    branches: [scratch/new-project-2026-08-12]
    paths:
      - 'economic-lab/scripts/rv08-r4-cm-common-normalization-identification-v10.mjs'
      - '.github/workflows/economic-lab-rv08-r4-cm-common-normalization-identification.yml'
  workflow_dispatch:
jobs:
  launch-beacon:
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'R4-CM launched'
  matrix:
    needs: launch-beacon
    strategy:
      fail-fast: false
      matrix:
        case:
          - original-A__ECON-RV02-A
          - original-C__ECON-RV02-C
          - heldout-E__ECON-RV08-HOLDOUT-E
          - heldout-F__ECON-RV08-HOLDOUT-F
    name: R4-CM ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=7168
      CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax gate
        run: node --check economic-lab/scripts/rv08-r4-cm-common-normalization-identification-v10.mjs
      - name: Run 24-month common normalization identification audit
        shell: bash
        run: |
          set -o pipefail
          LABEL="${CASE%%__*}"
          SEED="${CASE#*__}"
          mkdir -p economic-lab/performance-results
          DIAG_SEED="$SEED" DIAG_MONTHS=24 \
          OUTPUT_JSON="economic-lab/performance-results/r4-cm-${LABEL}.json" \
          node economic-lab/scripts/rv08-r4-cm-common-normalization-identification-v10.mjs \
          2>&1 | tee "economic-lab/performance-results/r4-cm-${LABEL}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-cm-${{ matrix.case }}
          path: economic-lab/performance-results/r4-cm-*
          retention-days: 90
  final-beacon:
    if: always()
    needs: matrix
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'R4-CM matrix completed'
