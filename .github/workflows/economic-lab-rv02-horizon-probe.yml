name: Economic Lab WP-RV02 Bounded Probe

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - '.github/workflows/economic-lab-rv02-horizon-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Publish bounded-probe pending beacon
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' > /tmp/rv02-bounded-pending.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "target_url": os.environ["RUN_URL"],
              "description": "WP-RV02 bounded 6->12 month probe is running",
              "context": "economic-lab/wp-rv02-bounded-probe"
          }))
          PY
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/rv02-bounded-pending.json

  compact-6:
    needs: start
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compact A — 1 seed x 6 months
        working-directory: economic-lab
        env:
          DIAG_LABEL: 'WP-RV02-BOUNDED-compact-a-m6'
          DIAG_MONTHS: '6'
          DIAG_SCALE: 'compact'
          DIAG_SEEDS: 'ECON-RV02-A'
          OUTPUT_JSON: 'performance-results/rv02-bounded-compact-a-m6.json'
        run: |
          set -euo pipefail
          echo "[WP-RV02] starting compact seed A, 6 months"
          node scripts/baseline-reproduction-v10.mjs &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            echo "[WP-RV02 heartbeat] compact-a-m6 still running at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep 30
          done
          wait "$pid"
          echo "[WP-RV02] compact-a-m6 completed"
      - name: Upload compact 6-month evidence
        uses: actions/upload-artifact@v4
        with:
          name: economic-lab-wp-rv02-compact-a-m6
          path: economic-lab/performance-results/rv02-bounded-compact-a-m6.json
          if-no-files-found: error
          retention-days: 30

  compact-12:
    needs: compact-6
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compact A — 1 seed x 12 months
        working-directory: economic-lab
        env:
          DIAG_LABEL: 'WP-RV02-BOUNDED-compact-a-m12'
          DIAG_MONTHS: '12'
          DIAG_SCALE: 'compact'
          DIAG_SEEDS: 'ECON-RV02-A'
          OUTPUT_JSON: 'performance-results/rv02-bounded-compact-a-m12.json'
        run: |
          set -euo pipefail
          echo "[WP-RV02] 6-month gate passed; starting compact seed A, 12 months"
          node scripts/baseline-reproduction-v10.mjs &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            echo "[WP-RV02 heartbeat] compact-a-m12 still running at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep 30
          done
          wait "$pid"
          echo "[WP-RV02] compact-a-m12 completed"
      - name: Upload compact 12-month evidence
        uses: actions/upload-artifact@v4
        with:
          name: economic-lab-wp-rv02-compact-a-m12
          path: economic-lab/performance-results/rv02-bounded-compact-a-m12.json
          if-no-files-found: error
          retention-days: 30

  finalize:
    if: always()
    needs: [start, compact-6, compact-12]
    runs-on: ubuntu-latest
    steps:
      - name: Publish bounded-probe final beacon
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          M6_RESULT: ${{ needs.compact-6.result }}
          M12_RESULT: ${{ needs.compact-12.result }}
        run: |
          python - <<'PY' > /tmp/rv02-bounded-final.json
          import json, os
          m6 = os.environ.get("M6_RESULT", "unknown")
          m12 = os.environ.get("M12_RESULT", "unknown")
          ok = m6 == "success" and m12 == "success"
          if ok:
              description = "WP-RV02 bounded 6/12 month probes passed"
          elif m6 != "success":
              description = f"WP-RV02 stopped at 6-month gate ({m6})"
          else:
              description = f"WP-RV02 12-month probe did not pass ({m12})"
          print(json.dumps({
              "state": "success" if ok else "failure",
              "target_url": os.environ["RUN_URL"],
              "description": description,
              "context": "economic-lab/wp-rv02-bounded-probe"
          }))
          PY
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/rv02-bounded-final.json
