name: Economic Lab WP-RV02 Horizon Probe

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - '.github/workflows/economic-lab-rv02-horizon-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Publish horizon-probe pending beacon
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' > /tmp/rv02-horizon-pending.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "target_url": os.environ["RUN_URL"],
              "description": "WP-RV02 horizon probe is running",
              "context": "economic-lab/wp-rv02-horizon-probe"
          }))
          PY
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/rv02-horizon-pending.json

  probe:
    needs: start
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_id: compact-a-m12
            scale: compact
            seed: ECON-RV02-A
            months: 12
          - case_id: compact-a-m18
            scale: compact
            seed: ECON-RV02-A
            months: 18
          - case_id: compact-a-m24
            scale: compact
            seed: ECON-RV02-A
            months: 24
          - case_id: compact-a-m30
            scale: compact
            seed: ECON-RV02-A
            months: 30
          - case_id: baseline-b-m12
            scale: baseline
            seed: ECON-RV02-B
            months: 12
          - case_id: baseline-b-m18
            scale: baseline
            seed: ECON-RV02-B
            months: 18
          - case_id: baseline-b-m24
            scale: baseline
            seed: ECON-RV02-B
            months: 24
          - case_id: baseline-b-m30
            scale: baseline
            seed: ECON-RV02-B
            months: 30
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute ${{ matrix.case_id }}
        working-directory: economic-lab
        env:
          DIAG_LABEL: WP-RV02-HORIZON-${{ matrix.case_id }}
          DIAG_MONTHS: ${{ matrix.months }}
          DIAG_SCALE: ${{ matrix.scale }}
          DIAG_SEEDS: ${{ matrix.seed }}
          OUTPUT_JSON: performance-results/${{ matrix.case_id }}.json
        run: node scripts/baseline-reproduction-v10.mjs
      - name: Upload ${{ matrix.case_id }} evidence
        uses: actions/upload-artifact@v4
        with:
          name: economic-lab-wp-rv02-${{ matrix.case_id }}
          path: economic-lab/performance-results/${{ matrix.case_id }}.json
          if-no-files-found: error
          retention-days: 30

  finalize:
    if: always()
    needs: [start, probe]
    runs-on: ubuntu-latest
    steps:
      - name: Publish horizon-probe final beacon
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MATRIX_RESULT: ${{ needs.probe.result }}
        run: |
          python - <<'PY' > /tmp/rv02-horizon-final.json
          import json, os
          ok = os.environ.get("MATRIX_RESULT") == "success"
          print(json.dumps({
              "state": "success" if ok else "failure",
              "target_url": os.environ["RUN_URL"],
              "description": "WP-RV02 horizon probe passed" if ok else "WP-RV02 horizon probe detected a bounded-run failure",
              "context": "economic-lab/wp-rv02-horizon-probe"
          }))
          PY
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/rv02-horizon-final.json
