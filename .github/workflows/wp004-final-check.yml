name: WP004 final closure validation

on:
  push:
    branches:
      - execution/week1-wp004-closure
    paths:
      - '.github/workflows/wp004-final-check.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Validate evidence-bearing closure state
        shell: bash
        run: |
          set +e
          cargo fmt --manifest-path production/Cargo.toml --all -- --check > /tmp/fmt.log 2>&1
          FMT=$?
          cargo clippy --manifest-path production/Cargo.toml --workspace --all-targets -- -D warnings > /tmp/clippy.log 2>&1
          CLIPPY=$?
          cargo test --manifest-path production/Cargo.toml --workspace > /tmp/test.log 2>&1
          TEST=$?
          set -e
          {
            echo "WP004_FINAL_VALIDATED_HEAD=$(git rev-parse HEAD)"
            echo "EVIDENCE_PRESENT=$(test -f docs/evidence/week1/wp004-absolute-world-time.md && echo 1 || echo 0)"
            echo "FMT_EXIT=$FMT"
            echo "CLIPPY_EXIT=$CLIPPY"
            echo "TEST_EXIT=$TEST"
          } > docs/evidence/week1/wp004-final-validation.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/evidence/week1/wp004-final-validation.txt
          git commit -m 'ci(time): publish final WP-004 closure validation [skip ci]'
          git push
          if [ "$FMT" -ne 0 ] || [ "$CLIPPY" -ne 0 ] || [ "$TEST" -ne 0 ]; then exit 1; fi
