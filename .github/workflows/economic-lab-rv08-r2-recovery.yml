name: Economic Lab WP-RV08-R2 Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - .github/workflows/economic-lab-rv08-r2-recovery.yml

permissions:
  contents: read
  statuses: write

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: economic-lab
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      DIAG_SCALES: compact,baseline
      DIAG_MONTHS: '12'
      DIAG_SEEDS: ECON-RV02-A,ECON-RV02-B,ECON-RV02-C
    steps:
      - name: Running beacon
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' >/tmp/s.json
          import json,os;print(json.dumps({'state':'pending','target_url':os.environ['RUN_URL'],'description':'WP-RV08-R2 recovery running','context':'economic-lab/wp-rv08-r2-recovery'}))
          PY
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" --data-binary @/tmp/s.json
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run matrix without giant JSON serialization
        run: |
          mkdir -p performance-results
          OUTPUT_JSON='' node scripts/rv08-entrant-underwriting-timing-matrix-v10.mjs > performance-results/rv08-r2-recovery.log
          grep '^WP_RV08_R2_GATES' performance-results/rv08-r2-recovery.log
          grep '^WP_RV08_R2_ENTRANTS' performance-results/rv08-r2-recovery.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economic-lab-wp-rv08-r2-recovery
          path: economic-lab/performance-results/rv08-r2-recovery.log
          if-no-files-found: warn
          retention-days: 30
      - name: Final beacon
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          python - <<'PY' >/tmp/s.json
          import json,os;print(json.dumps({'state':os.environ['API_STATE'],'target_url':os.environ['RUN_URL'],'description':'WP-RV08-R2 recovery finished','context':'economic-lab/wp-rv08-r2-recovery'}))
          PY
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" --data-binary @/tmp/s.json
