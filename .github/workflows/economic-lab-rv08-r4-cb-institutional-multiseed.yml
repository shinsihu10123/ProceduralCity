name: Economic Lab RV08 R4-CB Institutional Multi-Seed Replication

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - '.github/workflows/economic-lab-rv08-r4-cb-institutional-multiseed.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  NODE_OPTIONS: --max-old-space-size=7168

jobs:
  launch-beacon:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d '{"state":"pending","context":"economic-lab/wp-rv08-r4-cb","description":"R4-CB institutional multi-seed replication running","target_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

  census:
    name: R4-CB ${{ matrix.seedcase }} / ${{ matrix.base }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seedcase:
          - original-A__ECON-RV02-A
          - original-C__ECON-RV02-C
          - heldout-E__ECON-RV08-HOLDOUT-E
          - heldout-F__ECON-RV08-HOLDOUT-F
        base:
          - raw
          - materials-consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Run ecosystem and institutional census
        working-directory: economic-lab
        env:
          CASE: ${{ matrix.seedcase }}
          BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          LABEL="${CASE%%__*}"
          SEED="${CASE#*__}"
          mkdir -p performance-results
          DIAG_SEED="$SEED" DIAG_BASE="$BASE" DIAG_MONTHS=48 \
          OUTPUT_JSON="performance-results/r4-cb-ecosystem-${LABEL}-${BASE}.json" \
          node scripts/rv08-economic-ecosystem-structural-audit-v10.mjs \
          | tee "performance-results/r4-cb-ecosystem-${LABEL}-${BASE}.log"
          DIAG_SEED="$SEED" DIAG_BASE="$BASE" DIAG_MONTHS=48 \
          OUTPUT_JSON="performance-results/r4-cb-institutional-${LABEL}-${BASE}.json" \
          node scripts/rv08-institutional-maturity-network-census-v10.mjs \
          | tee "performance-results/r4-cb-institutional-${LABEL}-${BASE}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-cb-${{ matrix.seedcase }}-${{ matrix.base }}
          path: economic-lab/performance-results/r4-cb-*
          if-no-files-found: warn
          retention-days: 90

  final-beacon:
    if: always()
    needs: census
    runs-on: ubuntu-24.04
    steps:
      - name: Publish final status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.census.result }}
        run: |
          if [ "$RESULT" = "success" ]; then
            STATE=success
            DESC='R4-CB institutional replication passed'
          else
            STATE=failure
            DESC="R4-CB incomplete: $RESULT"
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{\"state\":\"$STATE\",\"context\":\"economic-lab/wp-rv08-r4-cb\",\"description\":\"$DESC\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
