name: Economic Lab RV08 R4-G Replacement Regeneration

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - .github/workflows/economic-lab-rv08-r4g.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: economic-lab-rv08-r4g
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=6144
  DIAG_SCALES: compact,baseline
  DIAG_MONTHS: '24'
  DIAG_SEEDS: ECON-RV02-A,ECON-RV02-B,ECON-RV02-C

jobs:
  cube:
    name: R4-G 24m replacement regeneration cube
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Running beacon
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' >/tmp/status.json
          import json,os
          print(json.dumps({'state':'pending','target_url':os.environ['RUN_URL'],'description':'RV08 R4-G 24m replacement cube running','context':'economic-lab/wp-rv08-r4-g'}))
          PY
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" --data-binary @/tmp/status.json
      - name: Run 24m replacement cube
        working-directory: economic-lab
        env:
          OUTPUT_JSON: performance-results/rv08-r4-g-replacement-24m.json
        run: |
          mkdir -p performance-results
          node scripts/replacement-regeneration-cube-v10.mjs | tee performance-results/rv08-r4-g.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economic-lab-wp-rv08-r4-g
          path: |
            economic-lab/performance-results/rv08-r4-g-replacement-24m.json
            economic-lab/performance-results/rv08-r4-g.log
          retention-days: 30
      - name: Final beacon
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          python - <<'PY' >/tmp/status.json
          import json,os
          print(json.dumps({'state':os.environ['API_STATE'],'target_url':os.environ['RUN_URL'],'description':'RV08 R4-G replacement cube finished','context':'economic-lab/wp-rv08-r4-g'}))
          PY
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" --data-binary @/tmp/status.json
