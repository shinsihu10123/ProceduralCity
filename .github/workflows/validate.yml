name: Validate city engine

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate independent V3 runtime
        run: npm test

      - name: Verify static entry files
        run: |
          test -f index.html
          test -f src/v3/main.js
          test -f src/v3/app.css
          test -f vendor/three.module.min.js
