name: Economic Lab WP-RV02

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - '.github/workflows/economic-lab-rv02.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Publish WP-RV02 pending beacon
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' > /tmp/rv02-pending.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "target_url": os.environ["RUN_URL"],
              "description": "WP-RV02 baseline reproduction is running",
              "context": "economic-lab/wp-rv02"
          }))
          PY
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/rv02-pending.json
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: R0 compact - 3 seeds x 36 months
        working-directory: economic-lab
        env:
          DIAG_LABEL: 'WP-RV02-R0-compact'
          DIAG_MONTHS: '36'
          DIAG_SCALE: 'compact'
          DIAG_SEEDS: 'ECON-RV02-A,ECON-RV02-B,ECON-RV02-C'
          OUTPUT_JSON: 'performance-results/reality-diagnostics-rv02-r0-compact.json'
        run: node scripts/baseline-reproduction-v10.mjs
      - name: R1 baseline - 3 seeds x 36 months
        working-directory: economic-lab
        env:
          DIAG_LABEL: 'WP-RV02-R1-baseline'
          DIAG_MONTHS: '36'
          DIAG_SCALE: 'baseline'
          DIAG_SEEDS: 'ECON-RV02-A,ECON-RV02-B,ECON-RV02-C'
          OUTPUT_JSON: 'performance-results/reality-diagnostics-rv02-r1-baseline.json'
        run: node scripts/baseline-reproduction-v10.mjs
      - name: Upload WP-RV02 evidence
        uses: actions/upload-artifact@v4
        with:
          name: economic-lab-wp-rv02
          path: economic-lab/performance-results/reality-diagnostics-rv02-*.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish WP-RV02 final beacon
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESCRIPTION: ${{ job.status == 'success' && 'WP-RV02 evidence gates passed' || 'WP-RV02 evidence gates failed' }}
        run: |
          python - <<'PY' > /tmp/rv02-final.json
          import json, os
          print(json.dumps({
              "state": os.environ["API_STATE"],
              "target_url": os.environ["RUN_URL"],
              "description": os.environ["DESCRIPTION"],
              "context": "economic-lab/wp-rv02"
          }))
          PY
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/rv02-final.json
