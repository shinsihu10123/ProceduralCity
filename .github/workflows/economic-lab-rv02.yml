name: Economic Lab WP-RV02 Staged Envelope

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - '.github/workflows/economic-lab-rv02.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  rv02-stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish WP-RV02 stage-2 running beacon
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' > /tmp/rv02-status-running.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "target_url": os.environ["RUN_URL"],
              "description": "WP-RV02 staged envelope is running",
              "context": "economic-lab/wp-rv02-stage2"
          }))
          PY
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/rv02-status-running.json
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: R0 compact stage-2 — 1 seed x 24 months
        working-directory: economic-lab
        env:
          DIAG_LABEL: 'WP-RV02-R0-stage2'
          DIAG_MONTHS: '24'
          DIAG_SCALE: 'compact'
          DIAG_SEEDS: 'ECON-RV02-A'
          OUTPUT_JSON: 'performance-results/reality-diagnostics-rv02-r0-stage2.json'
        run: node scripts/baseline-reproduction-v10.mjs
      - name: R1 baseline stage-2 — 1 seed x 12 months
        working-directory: economic-lab
        env:
          DIAG_LABEL: 'WP-RV02-R1-stage2'
          DIAG_MONTHS: '12'
          DIAG_SCALE: 'baseline'
          DIAG_SEEDS: 'ECON-RV02-A'
          OUTPUT_JSON: 'performance-results/reality-diagnostics-rv02-r1-stage2.json'
        run: node scripts/baseline-reproduction-v10.mjs
      - name: Upload WP-RV02 stage-2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: economic-lab-rv02-stage2
          path: economic-lab/performance-results/reality-diagnostics-rv02-*-stage2.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish WP-RV02 stage-2 final beacon
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESCRIPTION: ${{ job.status == 'success' && 'WP-RV02 staged envelope passed' || 'WP-RV02 staged envelope failed' }}
        run: |
          python - <<'PY' > /tmp/rv02-status-final.json
          import json, os
          print(json.dumps({
              "state": os.environ["API_STATE"],
              "target_url": os.environ["RUN_URL"],
              "description": os.environ["DESCRIPTION"],
              "context": "economic-lab/wp-rv02-stage2"
          }))
          PY
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/rv02-status-final.json
