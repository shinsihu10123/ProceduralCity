name: WP004 bounded format repair

on:
  push:
    branches:
      - execution/week1-wp004-closure
    paths:
      - '.github/workflows/wp004-probe.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Apply canonical rustfmt once
        run: |
          cargo fmt --manifest-path production/Cargo.toml --all
          if ! git diff --quiet; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add production/crates/world-time-core
            git commit -m 'style(time): apply canonical rustfmt [skip ci]'
            git push
          fi
