name: Economic Lab RV08 R4-CU-D3B Reference Membership Gate

on:
  push:
    branches: [scratch/new-project-2026-08-12]
    paths:
      - 'economic-lab/diagnostics/reality-validation/r4-cu-d3b-reference-membership-register.json'
      - 'economic-lab/scripts/rv08-r4-cu-d3b-reference-membership-gate.mjs'
      - '.github/workflows/economic-lab-rv08-r4-cu-d3b-reference-membership.yml'
  workflow_dispatch:

jobs:
  reference-membership-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax gate
        run: node --check economic-lab/scripts/rv08-r4-cu-d3b-reference-membership-gate.mjs
      - name: Validate R4-CU-D3B frozen membership
        run: node economic-lab/scripts/rv08-r4-cu-d3b-reference-membership-gate.mjs
  final-beacon:
    needs: reference-membership-gate
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'R4-CU-D3B reference-economy membership validated'
