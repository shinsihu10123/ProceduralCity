name: Economic Lab RV08 R4-CF-D Invoice Trade Credit Shadow Gate

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - 'economic-lab/src/research/invoice-trade-credit-shadow-contract.js'
      - 'economic-lab/scripts/rv08-r4-cf-d-invoice-trade-credit-shadow-v10.mjs'
      - '.github/workflows/economic-lab-rv08-r4-cf-d-invoice-trade-credit-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  launch-beacon:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish pending status
        run: echo 'R4-CF-D launched'

  r4-cf-d:
    needs: launch-beacon
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        case:
          - original-A__ECON-RV02-A
          - original-C__ECON-RV02-C
          - heldout-E__ECON-RV08-HOLDOUT-E
          - heldout-F__ECON-RV08-HOLDOUT-F
    name: R4-CF-D ${{ matrix.case }}
    env:
      NODE_OPTIONS: --max-old-space-size=7168
      CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax gates
        working-directory: economic-lab
        run: |
          node --check src/research/invoice-trade-credit-shadow-contract.js
          node --check scripts/rv08-r4-cf-d-invoice-trade-credit-shadow-v10.mjs
      - name: Run 24-month invoice trade-credit shadow gate
        working-directory: economic-lab
        run: |
          set -euo pipefail
          LABEL="${CASE%%__*}"
          SEED="${CASE#*__}"
          mkdir -p performance-results
          DIAG_SEED="$SEED" DIAG_MONTHS=24 \
          OUTPUT_JSON="performance-results/r4-cf-d-${LABEL}.json" \
          node scripts/rv08-r4-cf-d-invoice-trade-credit-shadow-v10.mjs \
          | tee "performance-results/r4-cf-d-${LABEL}.log"
      - uses: actions/upload-artifact@v4
        with:
          name: r4-cf-d-${{ matrix.case }}
          path: economic-lab/performance-results/r4-cf-d-*
          retention-days: 90

  final-beacon:
    needs: r4-cf-d
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Publish final status
        run: echo 'R4-CF-D matrix completed'
