name: One-time autofix S1.02.01

on:
  push:
    branches:
      - execution/week1-wp002-s1-02-01

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: execution/week1-wp002-s1-02-01

      - name: Format and Clippy-fix once
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$COMMIT_MESSAGE" = "chore(identity-core): autofix S1.02.01" ]; then
            echo "Autofix commit observed; nothing to do."
            exit 0
          fi
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          cargo fmt --manifest-path production/Cargo.toml --all
          cargo clippy --manifest-path production/Cargo.toml --workspace --all-targets --fix --allow-dirty --allow-staged -- -D warnings
          cargo fmt --manifest-path production/Cargo.toml --all
          cargo test --manifest-path production/Cargo.toml --workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/Cargo.toml production/crates/identity-core
          if git diff --cached --quiet; then
            echo "No autofix changes required"
            exit 0
          fi
          git commit -m "chore(identity-core): autofix S1.02.01"
          git push origin HEAD:execution/week1-wp002-s1-02-01
