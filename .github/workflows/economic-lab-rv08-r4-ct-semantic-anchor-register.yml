name: Economic Lab RV08 R4-CT Semantic Anchor Register Gate

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - 'economic-lab/diagnostics/reality-validation/economic-semantic-anchor-register-v1.json'
      - 'economic-lab/diagnostics/reality-validation/WP-RV08-R4-CT-ECONOMIC-SEMANTIC-ANCHOR-REGISTER-2026-08-28.md'
      - 'economic-lab/scripts/rv08-r4-ct-semantic-anchor-register-gate.mjs'
      - '.github/workflows/economic-lab-rv08-r4-ct-semantic-anchor-register.yml'
  workflow_dispatch:

jobs:
  semantic-anchor-register-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax gate
        run: node --check economic-lab/scripts/rv08-r4-ct-semantic-anchor-register-gate.mjs
      - name: Validate semantic anchor register
        run: node economic-lab/scripts/rv08-r4-ct-semantic-anchor-register-gate.mjs
  final-beacon:
    needs: semantic-anchor-register-gate
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'R4-CT semantic anchor register validated'
