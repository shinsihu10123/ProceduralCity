name: Economic Lab RV08 R4-CU-D3D-B6-S2 Evidence Finalizer

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - 'economic-lab/scripts/rv08-r4-cu-d3d-b6-s2-closure.mjs'
      - '.github/workflows/economic-lab-rv08-r4-cu-d3d-b6-s2-evidence-finalizer.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  persist-authoritative-evidence:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_WORKFLOW: economic-lab-rv08-r4-cu-d3d-b6-s2-heldout-replication.yml
      SOURCE_BRANCH: scratch/new-project-2026-08-12
      ARTIFACT_NAME: r4-cu-d3d-b6-s2-authoritative-aggregate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scratch/new-project-2026-08-12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and lock gates
        run: |
          node --check economic-lab/scripts/rv08-r4-cu-d3d-b6-s2-closure.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const protocol = JSON.parse(fs.readFileSync('economic-lab/diagnostics/reality-validation/r4-cu-d3d-b6-s2-heldout-replication-contract.json', 'utf8'));
          assert.equal(protocol.front, 'R4-CU-D3D-B6-S2');
          assert.equal(protocol.status, 'FROZEN_BEFORE_HELDOUT_EXECUTION');
          assert.equal(protocol.execution.candidateSeedJobs, 8);
          assert.equal(protocol.canonicalMutationAuthorized, false);
          assert.equal(protocol.directParameterCalibrationAuthorized, false);
          NODE
      - name: Wait for latest successful S2 authoritative run
        id: source
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=''
          for attempt in $(seq 1 120); do
            RUN_ID="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${SOURCE_WORKFLOW}/runs" \
              -f branch="${SOURCE_BRANCH}" -f per_page=10 \
              --jq '.workflow_runs[] | select(.status == "completed" and .conclusion == "success") | .id' | head -n 1)"
            if [ -n "$RUN_ID" ]; then
              break
            fi
            echo "No completed successful S2 run yet; attempt ${attempt}/120"
            sleep 10
          done
          test -n "$RUN_ID"
          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          HEAD_SHA="$(jq -r '.head_sha' <<<"$RUN_JSON")"
          RUN_URL="$(jq -r '.html_url' <<<"$RUN_JSON")"
          DISPLAY_TITLE="$(jq -r '.display_title' <<<"$RUN_JSON")"
          test "$(jq -r '.path' <<<"$RUN_JSON")" = ".github/workflows/${SOURCE_WORKFLOW}"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"
          echo "display_title=$DISPLAY_TITLE" >> "$GITHUB_OUTPUT"
          echo "Using S2 run ${RUN_ID} at ${HEAD_SHA}: ${DISPLAY_TITLE}"
      - name: Download authoritative aggregate artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID='${{ steps.source.outputs.run_id }}'
          ARTIFACT_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts")"
          ARTIFACT_ID="$(jq -r --arg name "$ARTIFACT_NAME" '.artifacts[] | select(.name == $name and .expired == false) | .id' <<<"$ARTIFACT_JSON" | head -n 1)"
          ARTIFACT_DIGEST="$(jq -r --arg name "$ARTIFACT_NAME" '.artifacts[] | select(.name == $name and .expired == false) | (.digest // "UNKNOWN")' <<<"$ARTIFACT_JSON" | head -n 1)"
          test -n "$ARTIFACT_ID"
          mkdir -p downloaded-b6-s2 evidence-b6-s2 economic-lab/diagnostics/reality-validation/evidence
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > downloaded-b6-s2/aggregate.zip
          unzip -q downloaded-b6-s2/aggregate.zip -d downloaded-b6-s2/unpacked
          AGGREGATE="$(find downloaded-b6-s2/unpacked -type f -name 'r4-cu-d3d-b6-s2-aggregate.json' | head -n 1)"
          SUMMARY="$(find downloaded-b6-s2/unpacked -type f -name 'r4-cu-d3d-b6-s2-summary.md' | head -n 1)"
          test -n "$AGGREGATE"
          test -n "$SUMMARY"
          cp "$AGGREGATE" economic-lab/diagnostics/reality-validation/evidence/r4-cu-d3d-b6-s2-authoritative-aggregate.json
          cp "$SUMMARY" economic-lab/diagnostics/reality-validation/evidence/r4-cu-d3d-b6-s2-authoritative-summary.md
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Generate authoritative closure
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          SOURCE_RUN_URL: ${{ steps.source.outputs.run_url }}
          SOURCE_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
        run: |
          node economic-lab/scripts/rv08-r4-cu-d3d-b6-s2-closure.mjs \
            economic-lab/diagnostics/reality-validation/evidence/r4-cu-d3d-b6-s2-authoritative-aggregate.json \
            economic-lab/diagnostics/reality-validation/WP-RV08_R4_CU_D3D_B6_S2_CLOSURE_v0.1.md
      - name: Persist evidence without retriggering the simulation
        shell: bash
        run: |
          set -euo pipefail
          AGGREGATE=economic-lab/diagnostics/reality-validation/evidence/r4-cu-d3d-b6-s2-authoritative-aggregate.json
          DECISION="$(node -p "JSON.parse(require('fs').readFileSync('$AGGREGATE','utf8')).decision")"
          PRIMARY="$(node -p "(JSON.parse(require('fs').readFileSync('$AGGREGATE','utf8')).primaryCandidate?.candidate?.id)||'NONE'")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            economic-lab/diagnostics/reality-validation/evidence/r4-cu-d3d-b6-s2-authoritative-aggregate.json \
            economic-lab/diagnostics/reality-validation/evidence/r4-cu-d3d-b6-s2-authoritative-summary.md \
            economic-lab/diagnostics/reality-validation/WP-RV08_R4_CU_D3D_B6_S2_CLOSURE_v0.1.md
          if git diff --cached --quiet; then
            echo 'Authoritative S2 evidence is already persisted.'
            exit 0
          fi
          git commit -m "docs(econ): close R4-CU-D3D-B6-S2 ${DECISION} primary ${PRIMARY}"
          git pull --rebase origin "$SOURCE_BRANCH"
          git push origin "HEAD:$SOURCE_BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: r4-cu-d3d-b6-s2-persisted-evidence
          path: |
            economic-lab/diagnostics/reality-validation/evidence/r4-cu-d3d-b6-s2-authoritative-aggregate.json
            economic-lab/diagnostics/reality-validation/evidence/r4-cu-d3d-b6-s2-authoritative-summary.md
            economic-lab/diagnostics/reality-validation/WP-RV08_R4_CU_D3D_B6_S2_CLOSURE_v0.1.md
          retention-days: 90
      - name: Final beacon
        run: echo 'R4-CU-D3D-B6-S2 authoritative evidence persisted'
