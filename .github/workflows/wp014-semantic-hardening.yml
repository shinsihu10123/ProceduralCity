name: WP014 semantic closure self-audit
on:
  push:
    branches:
      - execution/week1-wp014-transaction-precommit
permissions:
  contents: write
jobs:
  harden-and-validate:
    if: ${{ !contains(github.event.head_commit.message, 'WP-014 semantic diagnostic') && !contains(github.event.head_commit.message, 'harden WP-014 causal linkage') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Apply S1.07 pre-commit linkage self-audit hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('production/crates/transaction-precommit-core/src/lib.rs')
          s = p.read_text()
          s = s.replace(
              '        || root_digest64 == 0\n        || root.causal_parent.trim().is_empty()\n',
              '        || root_digest64 == 0\n        || root.operands != ["Canonical", "Authority", "Registry"]\n        || root.owner.trim().is_empty()\n        || root.writer.trim().is_empty()\n        || root.causal_parent.trim().is_empty()\n'
          )
          s = s.replace(
              '        || wp002.member_evidence.contains(&0)\n        || !wp002.reuse_audit.pass()\n',
              '        || wp002.member_evidence.contains(&0)\n        || wp002.reuse_audit.work_id != "S1.02.09"\n        || !wp002.reuse_audit.pass()\n'
          )

          old = '''    if guard.transaction_id != transaction.stable_id\n        || guard.transaction_version != transaction.version\n    {\n        return Err(TransactionError::ReferenceMismatch("S1.07.04 guard"));\n    }\n    let immutable_pre_state_digest64 = fnv1a64(format!("{:?}", read_set.entries).as_bytes());\n'''
          new = '''    if guard.transaction_id != transaction.stable_id\n        || guard.transaction_version != transaction.version\n    {\n        return Err(TransactionError::ReferenceMismatch("S1.07.04 guard"));\n    }\n    let fresh_read_receipt = validate_read_set(transaction, read_set)?;\n    let fresh_write_receipt =\n        validate_write_intents(transaction, read_set, &fresh_read_receipt, write_set)?;\n    if guard.read_set_digest64 != fresh_read_receipt.read_set_digest64\n        || guard.write_intent_digest64 != fresh_write_receipt.write_intent_digest64\n    {\n        return Err(TransactionError::ReferenceMismatch(\n            "S1.07.04 guard evidence / current speculative input",\n        ));\n    }\n    let immutable_pre_state_digest64 = fresh_read_receipt.read_set_digest64;\n'''
          if old not in s:
              raise SystemExit('S1.07.05 linkage patch point missing')
          s = s.replace(old, new)

          old = '''    if conditions.is_empty() && conservation.is_empty() {\n        return Err(TransactionError::MissingField("precommit.invariants"));\n    }\n    let expected: BTreeSet<_> = resolution.ordered_transaction_ids.iter().cloned().collect();\n'''
          new = '''    if conditions.is_empty() && conservation.is_empty() {\n        return Err(TransactionError::MissingField("precommit.invariants"));\n    }\n    for buffer in buffers {\n        validate_buffer(buffer)?;\n    }\n    let expected: BTreeSet<_> = resolution.ordered_transaction_ids.iter().cloned().collect();\n'''
          if old not in s:
              raise SystemExit('S1.07.08 buffer validation patch point missing')
          s = s.replace(old, new)

          old = '''    if handoff.work_id != "S1.07.08"\n        || !handoff.eligible_for_future_atomic_commit\n        || handoff.canonical_commit_performed\n        || handoff.disposition != Disposition::CandidateOnly\n    {\n        return Err(TransactionError::InvalidPreCommitHandoff);\n    }\n    let snapshot_digest64 = snapshot.digest64()?;\n'''
          new = '''    let snapshot_digest64 = snapshot.digest64()?;\n    let expected_event_order = MEMBER_IDS\n        .iter()\n        .map(|id| (*id).to_owned())\n        .collect::<Vec<_>>();\n    if snapshot.event_order != expected_event_order {\n        return Err(TransactionError::ReferenceMismatch(\n            "WP-014 snapshot event order",\n        ));\n    }\n    let snapshot_transactions = snapshot\n        .speculative_buffers\n        .iter()\n        .map(|buffer| buffer.transaction_id.clone())\n        .collect::<BTreeSet<_>>();\n    let handoff_transactions = handoff\n        .ordered_transaction_ids\n        .iter()\n        .cloned()\n        .collect::<BTreeSet<_>>();\n    let expected_source_buffer_digest64 =\n        fnv1a64(format!("{:?}", snapshot.speculative_buffers).as_bytes());\n    if handoff.work_id != "S1.07.08"\n        || !handoff.eligible_for_future_atomic_commit\n        || handoff.canonical_commit_performed\n        || handoff.disposition != Disposition::CandidateOnly\n        || handoff.invariant_evidence_digest64 == 0\n        || handoff.source_buffer_digest64 == 0\n        || handoff.source_buffer_digest64 != expected_source_buffer_digest64\n        || handoff.causal_parent.trim().is_empty()\n        || handoff.ordered_transaction_ids.is_empty()\n        || snapshot_transactions != handoff_transactions\n    {\n        return Err(TransactionError::InvalidPreCommitHandoff);\n    }\n'''
          if old not in s:
              raise SystemExit('WP-014 acceptance linkage patch point missing')
          s = s.replace(old, new)
          p.write_text(s)

          t = Path('production/crates/transaction-precommit-core/tests/wp014.rs')
          x = t.read_text()
          marker = 'fn s1_07_05_guard_evidence_cannot_be_reused_for_a_different_write_set()'
          if marker not in x:
              x += r'''

#[test]
fn s1_07_05_guard_evidence_cannot_be_reused_for_a_different_write_set() {
    let tx = transaction("txn-guard-link", 150, 0);
    let reads = read_set(&tx, "inventory.food", 7, "domain11.inventory");
    let original = write_set(
        &tx,
        "inventory.food",
        7,
        "domain11.inventory",
        "inventory.food",
    );
    let guard = pass_guard(&tx, &reads, &original);
    let mut swapped = original;
    swapped.intents[0].proposed_state_digest64 = 999_999;
    assert_eq!(
        build_speculative_buffer(
            &tx,
            &reads,
            &swapped,
            &guard,
            WriteOrigin::TransactionCoordinator,
        ),
        Err(TransactionError::ReferenceMismatch(
            "S1.07.04 guard evidence / current speculative input"
        ))
    );
}

#[test]
fn s1_07_08_rejects_a_buffer_that_claims_commit_already_happened() {
    let tx = transaction("txn-precommit-link", 200, 0);
    let mut buffer = buffer_for(&tx, "inventory.food", "domain11.inventory");
    let clean = buffer.clone();
    let report = detect_write_conflicts(std::slice::from_ref(&clean)).unwrap();
    let resolution = deterministic_resolution_order(
        &report,
        vec![ResolutionInput {
            transaction_id: tx.stable_id.clone(),
            world_time: tx.world_time.clone(),
            semantic_key: "inventory.food".to_owned(),
            causal_parent: tx.causal_parent.clone(),
            worker_hint: None,
        }],
    )
    .unwrap();
    buffer.canonical_commit_performed = true;
    assert_eq!(
        precommit_invariant_hook(
            &resolution,
            &[buffer],
            &[InvariantCondition {
                name: "valid".to_owned(),
                passed: true,
                evidence_digest64: 1,
            }],
            &[],
            "S1.07.08:precommit"
        ),
        Err(TransactionError::InvalidPreCommitHandoff)
    );
}

#[test]
fn wp014_acceptance_binds_snapshot_order_buffers_and_precommit_evidence() {
    let admission = admission();
    let tx = transaction("txn-accept-link", 220, 0);
    let mut registry = TransactionRegistry::default();
    registry
        .create(tx.clone(), WriteOrigin::TransactionCoordinator)
        .unwrap();
    let buffer = buffer_for(&tx, "inventory.food", "domain11.inventory");
    let report = detect_write_conflicts(std::slice::from_ref(&buffer)).unwrap();
    let resolution = deterministic_resolution_order(
        &report,
        vec![ResolutionInput {
            transaction_id: tx.stable_id.clone(),
            world_time: tx.world_time.clone(),
            semantic_key: "inventory.food".to_owned(),
            causal_parent: tx.causal_parent.clone(),
            worker_hint: None,
        }],
    )
    .unwrap();
    let handoff = precommit_invariant_hook(
        &resolution,
        std::slice::from_ref(&buffer),
        &[InvariantCondition {
            name: "valid".to_owned(),
            passed: true,
            evidence_digest64: 1,
        }],
        &[],
        "S1.07.08:accept-link",
    )
    .unwrap();

    let wrong_order = TransactionSnapshot::new(
        "snapshot:wrong-order",
        "cut:220:0",
        registry.clone(),
        vec![buffer.clone()],
        vec!["S1.07.08".to_owned()],
    )
    .unwrap();
    assert_eq!(
        accept_wp014(&admission, &[true; 8], &[1; 8], &wrong_order, &handoff),
        Err(TransactionError::ReferenceMismatch(
            "WP-014 snapshot event order"
        ))
    );

    let snapshot = TransactionSnapshot::new(
        "snapshot:linked",
        "cut:220:0",
        registry,
        vec![buffer],
        MEMBER_IDS.iter().map(|id| (*id).to_owned()).collect(),
    )
    .unwrap();
    let mut missing_evidence = handoff;
    missing_evidence.invariant_evidence_digest64 = 0;
    assert_eq!(
        accept_wp014(
            &admission,
            &[true; 8],
            &[1; 8],
            &snapshot,
            &missing_evidence,
        ),
        Err(TransactionError::InvalidPreCommitHandoff)
    );
}

#[test]
fn wp014_admission_rejects_a_forged_root_authority_operand() {
    let mut root = root();
    let wp002 = wp002();
    let wp004 = wp004(&root);
    let wp010 = wp010(&wp002);
    root.operands = ["Canonical", "Authority", "Forged"];
    assert_eq!(
        admit_wp014(&root, &wp002, &wp004, &wp010),
        Err(TransactionError::InvalidPredecessor("WP-001"))
    );
}
