name: Economic Lab RV08 R4-CF-E Trade Credit Aging Risk Gate

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - 'economic-lab/src/research/trade-credit-aging-shadow-ledger.js'
      - 'economic-lab/scripts/rv08-r4-cf-e-trade-credit-aging-risk-v10.mjs'
      - '.github/workflows/economic-lab-rv08-r4-cf-e-trade-credit-aging-risk.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  launch-beacon:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish pending status
        run: echo 'R4-CF-E launched'

  r4-cf-e:
    needs: launch-beacon
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        case:
          - original-A__ECON-RV02-A
          - original-C__ECON-RV02-C
          - heldout-E__ECON-RV08-HOLDOUT-E
          - heldout-F__ECON-RV08-HOLDOUT-F
    name: R4-CF-E ${{ matrix.case }}
    env:
      NODE_OPTIONS: --max-old-space-size=7168
      CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax gates
        working-directory: economic-lab
        run: |
          node --check src/research/trade-credit-aging-shadow-ledger.js
          node --check scripts/rv08-r4-cf-e-trade-credit-aging-risk-v10.mjs
      - name: Run 24-month trade-credit aging and seller-risk gate
        working-directory: economic-lab
        run: |
          set -o pipefail
          LABEL="${CASE%%__*}"
          SEED="${CASE#*__}"
          mkdir -p performance-results
          DIAG_SEED="$SEED" DIAG_MONTHS=24 \
          OUTPUT_JSON="performance-results/r4-cf-e-${LABEL}.json" \
          node scripts/rv08-r4-cf-e-trade-credit-aging-risk-v10.mjs \
          2>&1 | tee "performance-results/r4-cf-e-${LABEL}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-cf-e-${{ matrix.case }}
          path: economic-lab/performance-results/r4-cf-e-*
          retention-days: 90
          if-no-files-found: warn

  final-beacon:
    needs: r4-cf-e
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Publish final status
        run: echo 'R4-CF-E matrix completed'
