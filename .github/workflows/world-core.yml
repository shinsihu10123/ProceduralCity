name: Validate production world core

on:
  push:
    branches:
      - main
      - 'execution/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  world-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Bounded rustfmt capture
        run: |
          cargo fmt --manifest-path production/Cargo.toml --all
          echo LIB_BEGIN
          base64 -w0 production/crates/planetary-space-core/src/lib.rs
          echo
          echo LIB_END
          echo TEST_BEGIN
          base64 -w0 production/crates/planetary-space-core/tests/wp003.rs
          echo
          echo TEST_END
