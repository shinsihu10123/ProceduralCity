name: Validate production world core
on:
  push:
    branches: [main, 'execution/**']
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  world-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Bounded format repair
        run: |
          cargo fmt --manifest-path production/Cargo.toml --all
          if ! git diff --quiet; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add production/crates/planetary-space-core
            git commit -m 'style(space): format clippy repair'
            git push
          fi
      - name: Rust Clippy
        run: cargo clippy --manifest-path production/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path production/Cargo.toml --workspace
