name: One-time fix S1.02.02

on:
  push:
    branches:
      - execution/week1-wp002-s1-02-02

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: execution/week1-wp002-s1-02-02

      - name: Remove dead helper and validate
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$COMMIT_MESSAGE" = "fix(identity-core): resolve S1.02.02 clippy" ]; then
            echo "Fix commit observed; nothing to do."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('production/crates/identity-core/tests/s1_02_02_namespace_versioning.rs')
          text = p.read_text()
          start = text.find('fn evaluate(')
          if start != -1:
              next_test = text.find('\n#[test]', start)
              if next_test == -1:
                  raise SystemExit('could not find test boundary after helper')
              text = text[:start].rstrip() + '\n\n' + text[next_test+1:]
              p.write_text(text)
          PY
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          cargo fmt --manifest-path production/Cargo.toml --all
          cargo clippy --manifest-path production/Cargo.toml --workspace --all-targets -- -D warnings
          cargo test --manifest-path production/Cargo.toml --workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/crates/identity-core/tests/s1_02_02_namespace_versioning.rs
          if git diff --cached --quiet; then
            echo "No fix needed"
            exit 0
          fi
          git commit -m "fix(identity-core): resolve S1.02.02 clippy"
          git push origin HEAD:execution/week1-wp002-s1-02-02
