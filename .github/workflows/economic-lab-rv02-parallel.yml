name: Economic Lab WP-RV02 Baseline Multi-Seed Gate

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - '.github/workflows/economic-lab-rv02-parallel.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending beacon
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' > /tmp/rv02-multiseed-pending.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "target_url": os.environ["RUN_URL"],
              "description": "WP-RV02 baseline A/B/C 12-month gate is running",
              "context": "economic-lab/wp-rv02-baseline-multiseed"
          }))
          PY
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/rv02-multiseed-pending.json

  reproduce:
    needs: start
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_id: baseline-a-m12
            label: WP-RV02-MULTISEED-baseline-A-m12
            seed: ECON-RV02-A
          - case_id: baseline-b-m12
            label: WP-RV02-MULTISEED-baseline-B-m12
            seed: ECON-RV02-B
          - case_id: baseline-c-m12
            label: WP-RV02-MULTISEED-baseline-C-m12
            seed: ECON-RV02-C
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute ${{ matrix.case_id }}
        working-directory: economic-lab
        env:
          DIAG_LABEL: ${{ matrix.label }}
          DIAG_MONTHS: '12'
          DIAG_SCALE: 'baseline'
          DIAG_SEEDS: ${{ matrix.seed }}
          OUTPUT_JSON: performance-results/${{ matrix.case_id }}.json
        run: |
          set -euo pipefail
          echo "[WP-RV02] starting ${{ matrix.case_id }}"
          node scripts/baseline-reproduction-v10.mjs &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            echo "[WP-RV02 heartbeat] ${{ matrix.case_id }} still running at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep 30
          done
          wait "$pid"
          echo "[WP-RV02] ${{ matrix.case_id }} completed"
      - name: Upload ${{ matrix.case_id }} evidence
        uses: actions/upload-artifact@v4
        with:
          name: economic-lab-wp-rv02-${{ matrix.case_id }}
          path: economic-lab/performance-results/${{ matrix.case_id }}.json
          if-no-files-found: error
          retention-days: 30

  finalize:
    if: always()
    needs: [start, reproduce]
    runs-on: ubuntu-latest
    steps:
      - name: Publish final beacon
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MATRIX_RESULT: ${{ needs.reproduce.result }}
        run: |
          python - <<'PY' > /tmp/rv02-multiseed-final.json
          import json, os
          ok = os.environ.get("MATRIX_RESULT") == "success"
          print(json.dumps({
              "state": "success" if ok else "failure",
              "target_url": os.environ["RUN_URL"],
              "description": "WP-RV02 baseline A/B/C gate passed" if ok else "WP-RV02 baseline A/B/C gate failed",
              "context": "economic-lab/wp-rv02-baseline-multiseed"
          }))
          PY
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/rv02-multiseed-final.json
