name: Economic Lab RV08 R4-AO Payroll Flow Stock Audit

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - '.github/workflows/economic-lab-rv08-r4-ao-payroll-flow-stock.yml'
      - 'economic-lab/scripts/rv08-payroll-flow-stock-decomposition-v10.mjs'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  NODE_OPTIONS: --max-old-space-size=7168

jobs:
  launch-beacon:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d '{"state":"pending","context":"economic-lab/wp-rv08-r4-ao","description":"R4-AO payroll flow/claim-provenance audit running","target_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

  audit:
    name: R4-AO ${{ matrix.seedcase }} · ${{ matrix.base }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seedcase:
          - original-A__ECON-RV02-A
          - original-C__ECON-RV02-C
          - heldout-E__ECON-RV08-HOLDOUT-E
          - heldout-F__ECON-RV08-HOLDOUT-F
        base: [consumer, materials-consumer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run payroll flow / legacy stock / claim provenance audit
        working-directory: economic-lab
        env:
          CASE: ${{ matrix.seedcase }}
          BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          LABEL="${CASE%%__*}"
          SEED="${CASE#*__}"
          mkdir -p performance-results
          DIAG_MONTHS=36 \
          DIAG_CHECK_MONTHS=6 \
          DIAG_BASES="$BASE" \
          DIAG_SEEDS="$SEED" \
          DIAG_REGIMES='control,mean3-immediate,mean3-ramp,floor3-ramp,hysteresis-ramp' \
          OUTPUT_JSON="performance-results/rv08-r4-ao-${LABEL}-${BASE}.json" \
          node scripts/rv08-payroll-flow-stock-decomposition-v10.mjs \
          | tee "performance-results/rv08-r4-ao-${LABEL}-${BASE}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rv08-r4-ao-${{ matrix.seedcase }}-${{ matrix.base }}
          path: |
            economic-lab/performance-results/rv08-r4-ao-*.json
            economic-lab/performance-results/rv08-r4-ao-*.log
          if-no-files-found: warn
          retention-days: 90

  final-beacon:
    if: always()
    needs: audit
    runs-on: ubuntu-24.04
    steps:
      - name: Publish final status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.audit.result }}
        run: |
          if [ "$RESULT" = "success" ]; then
            STATE=success
            DESC='R4-AO payroll flow/claim-provenance audit passed'
          else
            STATE=failure
            DESC="R4-AO incomplete: $RESULT"
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{\"state\":\"$STATE\",\"context\":\"economic-lab/wp-rv08-r4-ao\",\"description\":\"$DESC\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"