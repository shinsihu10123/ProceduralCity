name: Economic Lab RV08 R4-AT Labor Eligibility Counterfactual

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - '.github/workflows/economic-lab-rv08-r4-at-labor-eligibility.yml'
      - 'economic-lab/scripts/rv08-labor-eligibility-counterfactual-v10.mjs'
      - 'economic-lab/src/markets/labor-market.js'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  NODE_OPTIONS: --max-old-space-size=7168

jobs:
  launch-beacon:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d '{"state":"pending","context":"economic-lab/wp-rv08-r4-at","description":"R4-AT labor eligibility counterfactual running","target_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

  audit:
    name: R4-AT ${{ matrix.seedcase }} · ${{ matrix.base }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seedcase:
          - original-A__ECON-RV02-A
          - original-C__ECON-RV02-C
          - heldout-E__ECON-RV08-HOLDOUT-E
          - heldout-F__ECON-RV08-HOLDOUT-F
        base: [consumer, materials-consumer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run labor eligibility causal counterfactual
        working-directory: economic-lab
        env:
          CASE: ${{ matrix.seedcase }}
          BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          LABEL="${CASE%%__*}"
          SEED="${CASE#*__}"
          mkdir -p performance-results
          DIAG_MONTHS=24 \
          DIAG_SEEDS="$SEED" \
          DIAG_BASES="$BASE" \
          DIAG_ELIGIBLE_SHARES='1,0.8,0.7,0.6' \
          OUTPUT_JSON="performance-results/rv08-r4-at-${LABEL}-${BASE}.json" \
          node scripts/rv08-labor-eligibility-counterfactual-v10.mjs \
          | tee "performance-results/rv08-r4-at-${LABEL}-${BASE}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rv08-r4-at-${{ matrix.seedcase }}-${{ matrix.base }}
          path: |
            economic-lab/performance-results/rv08-r4-at-*.json
            economic-lab/performance-results/rv08-r4-at-*.log
          if-no-files-found: warn
          retention-days: 90

  final-beacon:
    if: always()
    needs: audit
    runs-on: ubuntu-24.04
    steps:
      - name: Publish final status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.audit.result }}
        run: |
          if [ "$RESULT" = "success" ]; then
            STATE=success
            DESC='R4-AT labor eligibility counterfactual passed'
          else
            STATE=failure
            DESC="R4-AT incomplete: $RESULT"
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{\"state\":\"$STATE\",\"context\":\"economic-lab/wp-rv08-r4-at\",\"description\":\"$DESC\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
