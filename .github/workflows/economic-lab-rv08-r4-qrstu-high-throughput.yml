name: Economic Lab RV08 R4-QRSTU High Throughput

on:
  workflow_dispatch:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - .github/workflows/economic-lab-rv08-r4-qrstu-high-throughput.yml

permissions:
  contents: read
  statuses: read

env:
  NODE_OPTIONS: --max-old-space-size=7168

jobs:
  q-sharded-36m:
    name: R4-Q 36m ${{ matrix.scale }} ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { scale: compact, id: A, seed: ECON-RV02-A }
          - { scale: compact, id: B, seed: ECON-RV02-B }
          - { scale: compact, id: C, seed: ECON-RV02-C }
          - { scale: baseline, id: A, seed: ECON-RV02-A }
          - { scale: baseline, id: B, seed: ECON-RV02-B }
          - { scale: baseline, id: C, seed: ECON-RV02-C }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run sharded R4-Q
        working-directory: economic-lab
        env:
          DIAG_TRACK: Q
          DIAG_MONTHS: '36'
          DIAG_SCALES: ${{ matrix.scale }}
          DIAG_SEEDS: ${{ matrix.seed }}
          OUTPUT_JSON: performance-results/rv08-r4-q-36m-${{ matrix.scale }}-${{ matrix.id }}.json
        run: |
          set -o pipefail
          mkdir -p performance-results
          node scripts/rv08-restructure-liquidation-state-machine-v10.mjs | tee performance-results/rv08-r4-q-36m-${{ matrix.scale }}-${{ matrix.id }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economic-lab-wp-rv08-r4-q-${{ matrix.scale }}-${{ matrix.id }}
          path: |
            economic-lab/performance-results/rv08-r4-q-36m-${{ matrix.scale }}-${{ matrix.id }}.json
            economic-lab/performance-results/rv08-r4-q-36m-${{ matrix.scale }}-${{ matrix.id }}.log
          retention-days: 30
          if-no-files-found: warn

  r-persistence-48m:
    name: R4-R 48m recoverability ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { id: A, seed: ECON-RV02-A }
          - { id: B, seed: ECON-RV02-B }
          - { id: C, seed: ECON-RV02-C }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run R4-R 48m recoverability persistence
        working-directory: economic-lab
        env:
          DIAG_TRACK: P
          DIAG_MONTHS: '48'
          DIAG_SCALES: baseline
          DIAG_SEEDS: ${{ matrix.seed }}
          OUTPUT_JSON: performance-results/rv08-r4-r-48m-${{ matrix.id }}.json
        run: |
          set -o pipefail
          mkdir -p performance-results
          node scripts/rv08-restructure-liquidation-state-machine-v10.mjs | tee performance-results/rv08-r4-r-48m-${{ matrix.id }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economic-lab-wp-rv08-r4-r-${{ matrix.id }}
          path: |
            economic-lab/performance-results/rv08-r4-r-48m-${{ matrix.id }}.json
            economic-lab/performance-results/rv08-r4-r-48m-${{ matrix.id }}.log
          retention-days: 30
          if-no-files-found: warn

  s-heldout-24m:
    name: R4-S held-out recoverability ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { id: D, seed: ECON-RV08-HOLDOUT-D }
          - { id: E, seed: ECON-RV08-HOLDOUT-E }
          - { id: F, seed: ECON-RV08-HOLDOUT-F }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run R4-S held-out recoverability
        working-directory: economic-lab
        env:
          DIAG_TRACK: P
          DIAG_MONTHS: '24'
          DIAG_SCALES: baseline
          DIAG_SEEDS: ${{ matrix.seed }}
          OUTPUT_JSON: performance-results/rv08-r4-s-24m-${{ matrix.id }}.json
        run: |
          set -o pipefail
          mkdir -p performance-results
          node scripts/rv08-restructure-liquidation-state-machine-v10.mjs | tee performance-results/rv08-r4-s-24m-${{ matrix.id }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economic-lab-wp-rv08-r4-s-${{ matrix.id }}
          path: |
            economic-lab/performance-results/rv08-r4-s-24m-${{ matrix.id }}.json
            economic-lab/performance-results/rv08-r4-s-24m-${{ matrix.id }}.log
          retention-days: 30
          if-no-files-found: warn

  t-estate-isolation-48m:
    name: R4-T 48m restructure-estate ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { id: A, seed: ECON-RV02-A }
          - { id: B, seed: ECON-RV02-B }
          - { id: C, seed: ECON-RV02-C }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run R4-T 48m restructure-estate isolation
        working-directory: economic-lab
        env:
          DIAG_TRACK: O
          DIAG_MONTHS: '48'
          DIAG_SCALES: baseline
          DIAG_SEEDS: ${{ matrix.seed }}
          OUTPUT_JSON: performance-results/rv08-r4-t-48m-${{ matrix.id }}.json
        run: |
          set -o pipefail
          mkdir -p performance-results
          node scripts/rv08-restructure-liquidation-state-machine-v10.mjs | tee performance-results/rv08-r4-t-48m-${{ matrix.id }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economic-lab-wp-rv08-r4-t-${{ matrix.id }}
          path: |
            economic-lab/performance-results/rv08-r4-t-48m-${{ matrix.id }}.json
            economic-lab/performance-results/rv08-r4-t-48m-${{ matrix.id }}.log
          retention-days: 30
          if-no-files-found: warn

  u-heldout-supply-24m:
    name: R4-U held-out restructure-supply ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { id: D, seed: ECON-RV08-HOLDOUT-D }
          - { id: E, seed: ECON-RV08-HOLDOUT-E }
          - { id: F, seed: ECON-RV08-HOLDOUT-F }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run R4-U held-out restructure-supply
        working-directory: economic-lab
        env:
          DIAG_TRACK: Q
          DIAG_MONTHS: '24'
          DIAG_SCALES: baseline
          DIAG_SEEDS: ${{ matrix.seed }}
          OUTPUT_JSON: performance-results/rv08-r4-u-24m-${{ matrix.id }}.json
        run: |
          set -o pipefail
          mkdir -p performance-results
          node scripts/rv08-restructure-liquidation-state-machine-v10.mjs | tee performance-results/rv08-r4-u-24m-${{ matrix.id }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economic-lab-wp-rv08-r4-u-${{ matrix.id }}
          path: |
            economic-lab/performance-results/rv08-r4-u-24m-${{ matrix.id }}.json
            economic-lab/performance-results/rv08-r4-u-24m-${{ matrix.id }}.log
          retention-days: 30
          if-no-files-found: warn
