name: Economic Lab CI

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - 'economic-lab/**'
      - '.github/workflows/economic-lab-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: economic-lab
        run: npm install
      - name: Test
        working-directory: economic-lab
        run: npm test
      - name: Build
        working-directory: economic-lab
        run: npm run build
