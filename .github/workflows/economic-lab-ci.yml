name: Economic Lab CI

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - 'economic-lab/**'
      - '.github/workflows/economic-lab-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: economic-lab
        run: npm install
      - name: Test
        working-directory: economic-lab
        run: npm test
      - name: WP-RV01 reality diagnostics evidence
        working-directory: economic-lab
        env:
          DIAG_MONTHS: '12'
          DIAG_SCALE: 'compact'
          DIAG_SEEDS: 'ECON-RV01-DIAG-A'
          OUTPUT_JSON: 'performance-results/reality-diagnostics-rv01.json'
        run: npm run diagnose:reality:v10
      - name: Multi-shock stress matrix
        working-directory: economic-lab
        env:
          STRESS_MONTHS: '6'
          STRESS_SCALE: 'compact'
          OUTPUT_JSON: 'performance-results/stress-matrix.json'
        run: npm run stress:v10
      - name: Emergence ensemble
        working-directory: economic-lab
        env:
          EMERGENCE_MONTHS: '24'
          EMERGENCE_SCALE: 'compact'
          OUTPUT_JSON: 'performance-results/emergence-ensemble.json'
        run: npm run emergence:v10
      - name: Cold scale benchmark
        working-directory: economic-lab
        env:
          BENCH_WARMUP: '0'
          BENCH_MONTHS: '1'
          OUTPUT_JSON: 'performance-results/cold-scale.json'
        run: npm run bench:v10 -- baseline x2 x5 x10
      - name: Cold x10 CPU hotspot profile
        working-directory: economic-lab
        env:
          CPU_PROFILE_WARMUP: '0'
          CPU_PROFILE_MONTHS: '1'
          CPU_PROFILE_TOP: '25'
          OUTPUT_JSON: 'performance-results/cold-x10-cpu.json'
        run: npm run profile:v10 -- x10
      - name: Steady-state x10 benchmark
        working-directory: economic-lab
        env:
          BENCH_WARMUP: '2'
          BENCH_MONTHS: '1'
          OUTPUT_JSON: 'performance-results/steady-x10.json'
        run: npm run bench:v10 -- x10
      - name: Steady-state x10 CPU hotspot profile
        working-directory: economic-lab
        env:
          CPU_PROFILE_WARMUP: '2'
          CPU_PROFILE_MONTHS: '1'
          CPU_PROFILE_TOP: '25'
          OUTPUT_JSON: 'performance-results/steady-x10-cpu.json'
        run: npm run profile:v10 -- x10
      - name: Build
        working-directory: economic-lab
        run: npm run build
      - name: Upload performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: economic-lab-v10-performance
          path: economic-lab/performance-results/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish CI status beacon
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESCRIPTION: ${{ job.status == 'success' && 'Economic Lab v0.10 gates passed' || 'Economic Lab v0.10 gates failed' }}
        run: |
          python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              "state": os.environ["API_STATE"],
              "target_url": os.environ["RUN_URL"],
              "description": os.environ["DESCRIPTION"],
              "context": "economic-lab/v0.10-ci"
          }))
          PY
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/status.json
