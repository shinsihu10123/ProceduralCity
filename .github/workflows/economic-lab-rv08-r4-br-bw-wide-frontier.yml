  final-beacon:
    if: always()
    needs:
      - br-waterfall
      - br-lifecycle
      - bs-rejection-trace
      - bs-underwriting-timing
      - bu-demographic
      - bu-working-age
      - bu-person-unit
      - bu-eligibility
      - bv-stranded-assets
      - bv-recycling
      - bv-accounting-estate
      - bv-liquidation-state
      - bw-ecosystem
      - bw-institutional
    runs-on: ubuntu-24.04
    steps:
      - name: Publish final status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJson(needs) }}
        run: |
          if echo "$RESULTS" | grep -Eq '"result"[[:space:]]*:[[:space:]]*"(failure|cancelled)"'; then
            STATE=failure
            DESC='R4-BR-BW wide frontier completed with failed fronts'
          else
            STATE=success
            DESC='R4-BR-BW wide frontier completed'
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{\"state\":\"$STATE\",\"context\":\"economic-lab/wp-rv08-r4-br-bw\",\"description\":\"$DESC\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
