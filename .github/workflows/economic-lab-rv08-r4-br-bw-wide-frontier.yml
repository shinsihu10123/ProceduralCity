name: Economic Lab RV08 R4-BR-BW Wide Frontier

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - '.github/workflows/economic-lab-rv08-r4-br-bw-wide-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  NODE_OPTIONS: --max-old-space-size=7168
  WIDE_SEEDS: ECON-RV02-A,ECON-RV02-C,ECON-RV08-HOLDOUT-E,ECON-RV08-HOLDOUT-F

jobs:
  launch-beacon:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d '{"state":"pending","context":"economic-lab/wp-rv08-r4-br-bw","description":"R4-BR-BW wide frontier running","target_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

  br-waterfall:
    name: R4-BR cash-flow waterfall ${{ matrix.seedcase }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seedcase:
          - original-A__ECON-RV02-A
          - original-C__ECON-RV02-C
          - heldout-E__ECON-RV08-HOLDOUT-E
          - heldout-F__ECON-RV08-HOLDOUT-F
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Run exit-candidate cash-flow waterfall
        working-directory: economic-lab
        env:
          CASE: ${{ matrix.seedcase }}
        run: |
          set -euo pipefail
          LABEL="${CASE%%__*}"
          SEED="${CASE#*__}"
          mkdir -p performance-results
          DIAG_SEED="$SEED" DIAG_SEEDS="$SEED" DIAG_MONTHS=36 DIAG_SCALES=baseline \
          OUTPUT_JSON="performance-results/r4-br-waterfall-${LABEL}.json" \
          OUTPUT_CSV="performance-results/r4-br-waterfall-${LABEL}.csv" \
          node scripts/rv08-exit-candidate-cashflow-waterfall-v10.mjs \
          | tee "performance-results/r4-br-waterfall-${LABEL}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-br-waterfall-${{ matrix.seedcase }}
          path: economic-lab/performance-results/r4-br-waterfall-*
          if-no-files-found: warn
          retention-days: 90

  br-lifecycle:
    name: R4-BR entrant finance lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Run entrant finance lifecycle audit
        working-directory: economic-lab
        run: |
          set -euo pipefail
          mkdir -p performance-results
          DIAG_SEEDS="$WIDE_SEEDS" DIAG_MONTHS=36 DIAG_SCALES=baseline \
          OUTPUT_JSON="performance-results/r4-br-entrant-lifecycle.json" \
          node scripts/entrant-finance-lifecycle-audit-v10.mjs \
          | tee performance-results/r4-br-entrant-lifecycle.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-br-entrant-lifecycle
          path: economic-lab/performance-results/r4-br-entrant-lifecycle*
          if-no-files-found: warn
          retention-days: 90

  bs-rejection-trace:
