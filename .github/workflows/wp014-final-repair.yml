name: WP014 bounded final correction
on:
  push:
    branches:
      - execution/week1-wp014-transaction-precommit
permissions:
  contents: write
jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Apply bounded correction cycle 2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('production/crates/transaction-precommit-core/src/lib.rs')
          s = p.read_text()
          s = s.replace(
              '        || root_digest64 == 0\n        || root.causal_parent.trim().is_empty()\n',
              '        || root_digest64 == 0\n        || root.operands != ["Canonical", "Authority", "Registry"]\n        || root.owner.trim().is_empty()\n        || root.writer.trim().is_empty()\n        || root.causal_parent.trim().is_empty()\n'
          )
          s = s.replace(
              '        || wp002.member_evidence.contains(&0)\n        || !wp002.reuse_audit.pass()\n',
              '        || wp002.member_evidence.contains(&0)\n        || wp002.reuse_audit.work_id != "S1.02.09"\n        || !wp002.reuse_audit.pass()\n'
          )
          needle = '''    if guard.transaction_id != transaction.stable_id\n        || guard.transaction_version != transaction.version\n    {\n        return Err(TransactionError::ReferenceMismatch("S1.07.04 guard"));\n    }\n    let immutable_pre_state_digest64 = fnv1a64(format!("{:?}", read_set.entries).as_bytes());\n'''
          replacement = '''    if guard.transaction_id != transaction.stable_id\n        || guard.transaction_version != transaction.version\n    {\n        return Err(TransactionError::ReferenceMismatch("S1.07.04 guard"));\n    }\n    let fresh_read_receipt = validate_read_set(transaction, read_set)?;\n    let fresh_write_receipt =\n        validate_write_intents(transaction, read_set, &fresh_read_receipt, write_set)?;\n    if guard.read_set_digest64 != fresh_read_receipt.read_set_digest64\n        || guard.write_intent_digest64 != fresh_write_receipt.write_intent_digest64\n    {\n        return Err(TransactionError::ReferenceMismatch(\n            "S1.07.04 guard evidence / current speculative input",\n        ));\n    }\n    let immutable_pre_state_digest64 = fresh_read_receipt.read_set_digest64;\n'''
          if needle not in s:
              raise SystemExit('build_speculative_buffer patch point not found')
          s = s.replace(needle, replacement)
          needle = '''    if conditions.is_empty() && conservation.is_empty() {\n        return Err(TransactionError::MissingField("precommit.invariants"));\n    }\n    let expected: BTreeSet<_> = resolution.ordered_transaction_ids.iter().cloned().collect();\n'''
          replacement = '''    if conditions.is_empty() && conservation.is_empty() {\n        return Err(TransactionError::MissingField("precommit.invariants"));\n    }\n    for buffer in buffers {\n        validate_buffer(buffer)?;\n    }\n    let expected: BTreeSet<_> = resolution.ordered_transaction_ids.iter().cloned().collect();\n'''
          if needle not in s:
              raise SystemExit('precommit patch point not found')
          s = s.replace(needle, replacement)
          p.write_text(s)

          t = Path('production/crates/transaction-precommit-core/tests/wp014.rs')
          x = t.read_text()
          x = x.replace(
              '    assert_eq!(buffer.canonical_commit_performed, false);',
              '    assert!(!buffer.canonical_commit_performed);'
          )
          x = x.replace(
              '    assert_eq!(restored_order, MEMBER_IDS);',
              '    assert_eq!(\n        restored_order,\n        MEMBER_IDS\n            .iter()\n            .map(|id| (*id).to_owned())\n            .collect::<Vec<_>>()\n    );'
          )
          x += r'''

#[test]
fn s1_07_05_guard_evidence_cannot_be_reused_for_a_different_write_set() {
    let tx = transaction("txn-guard-link", 150, 0);
    let reads = read_set(&tx, "inventory.food", 7, "domain11.inventory");
    let original = write_set(
        &tx,
        "inventory.food",
        7,
        "domain11.inventory",
        "inventory.food",
    );
    let guard = pass_guard(&tx, &reads, &original);
    let swapped = WriteIntentSet {
        transaction_id: tx.stable_id.clone(),
        transaction_version: tx.version,
        owner: tx.owner.clone(),
        causal_parent: tx.causal_parent.clone(),
        intents: vec![WriteIntent {
            state_key: "inventory.food".to_owned(),
            base_version: 7,
            target_owner: "domain11.inventory".to_owned(),
            proposed_state_digest64: 999_999,
            semantic_key: "inventory.food".to_owned(),
        }],
    };
    assert_eq!(
        build_speculative_buffer(
            &tx,
            &reads,
            &swapped,
            &guard,
            WriteOrigin::TransactionCoordinator,
        ),
        Err(TransactionError::ReferenceMismatch(
            "S1.07.04 guard evidence / current speculative input"
        ))
    );
}
'''
          t.write_text(x)
          PY
      - name: Canonical format
        run: cargo fmt --manifest-path production/Cargo.toml --all
      - name: Strict Clippy
        run: cargo clippy --manifest-path production/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Full workspace tests
        run: cargo test --manifest-path production/Cargo.toml --workspace
      - name: Dedicated WP-014 tests
        run: cargo test --manifest-path production/Cargo.toml -p gaonn-transaction-precommit-core --test wp014
      - name: Commit validated correction
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add production/crates/transaction-precommit-core production/Cargo.toml production/Cargo.lock
          git commit -m 'fix(transaction): close WP-014 precommit integrity gaps'
          git push
