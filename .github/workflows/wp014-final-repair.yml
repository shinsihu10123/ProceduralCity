name: WP014 bounded final correction
on:
  push:
    branches:
      - execution/week1-wp014-transaction-precommit
permissions:
  contents: write
jobs:
  repair-and-validate:
    if: ${{ !contains(github.event.head_commit.message, 'WP-014 cycle2 diagnostic') && !contains(github.event.head_commit.message, 'finalize WP-014 cycle2') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Apply bounded correction cycle 2 candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t = Path('production/crates/transaction-precommit-core/tests/wp014.rs')
          x = t.read_text()
          x = x.replace(
              '    assert_eq!(buffer.canonical_commit_performed, false);',
              '    assert!(!buffer.canonical_commit_performed);'
          )
          x = x.replace(
              '    assert_eq!(restored_order, MEMBER_IDS);',
              '    assert_eq!(\n        restored_order,\n        MEMBER_IDS\n            .iter()\n            .map(|id| (*id).to_owned())\n            .collect::<Vec<_>>()\n    );'
          )
          t.write_text(x)
          PY
          cargo fmt --manifest-path production/Cargo.toml --all
      - name: Validate correction candidate and capture diagnostics
        run: |
          set +e
          cargo clippy --manifest-path production/Cargo.toml --workspace --all-targets -- -D warnings > /tmp/wp014-clippy.log 2>&1
          CLIPPY=$?
          cargo test --manifest-path production/Cargo.toml --workspace > /tmp/wp014-workspace.log 2>&1
          TESTS=$?
          cargo test --manifest-path production/Cargo.toml -p gaonn-transaction-precommit-core --test wp014 > /tmp/wp014-dedicated.log 2>&1
          DEDICATED=$?
          set -e
          mkdir -p docs/evidence/week1
          {
            echo "WP014_CORRECTION_CYCLE=2"
            echo "CLIPPY_EXIT=$CLIPPY"
            echo "WORKSPACE_TEST_EXIT=$TESTS"
            echo "DEDICATED_TEST_EXIT=$DEDICATED"
            echo "--- CLIPPY TAIL ---"
            tail -n 120 /tmp/wp014-clippy.log
            echo "--- WORKSPACE TEST TAIL ---"
            tail -n 160 /tmp/wp014-workspace.log
            echo "--- DEDICATED TEST ---"
            cat /tmp/wp014-dedicated.log
          } > docs/evidence/week1/wp014-cycle2-run.txt
          if [ "$CLIPPY" -ne 0 ] || [ "$TESTS" -ne 0 ] || [ "$DEDICATED" -ne 0 ]; then
            git restore production/crates/transaction-precommit-core production/Cargo.lock || true
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add docs/evidence/week1/wp014-cycle2-run.txt
            git commit -m 'docs(transaction): WP-014 cycle2 diagnostic'
            git push
            exit 0
          fi
      - name: Commit validated correction
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add production/crates/transaction-precommit-core production/Cargo.toml production/Cargo.lock docs/evidence/week1/wp014-cycle2-run.txt
          git commit -m 'fix(transaction): finalize WP-014 cycle2'
          git push
