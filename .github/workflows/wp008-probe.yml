name: WP008 bounded validation probe

on:
  push:
    branches:
      - execution/week1-wp008-final
    paths:
      - 'production/crates/celestial-core/**'
      - 'production/Cargo.toml'
      - 'production/Cargo.lock'
      - '.github/workflows/wp008-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Validate and publish report
        shell: bash
        run: |
          set +e
          cargo fmt --manifest-path production/Cargo.toml --all -- --check > /tmp/fmt.log 2>&1
          FMT=$?
          cargo clippy --manifest-path production/Cargo.toml --workspace --all-targets -- -D warnings > /tmp/clippy.log 2>&1
          CLIPPY=$?
          cargo test --manifest-path production/Cargo.toml --workspace > /tmp/test.log 2>&1
          TEST=$?
          cargo test --manifest-path production/Cargo.toml -p gaonn-celestial-core --test wp008 > /tmp/wp008.log 2>&1
          WP008=$?
          set -e
          mkdir -p docs/evidence/week1
          {
            echo "WP008_PROBE_HEAD=$(git rev-parse HEAD)"
            echo "FMT_EXIT=$FMT"
            echo "CLIPPY_EXIT=$CLIPPY"
            echo "WORKSPACE_TEST_EXIT=$TEST"
            echo "WP008_TEST_EXIT=$WP008"
            echo '--- FMT ---'
            cat /tmp/fmt.log
            echo '--- CLIPPY ---'
            cat /tmp/clippy.log
            echo '--- WP008 TEST ---'
            cat /tmp/wp008.log
            echo '--- WORKSPACE TEST TAIL ---'
            tail -n 120 /tmp/test.log
          } > docs/evidence/week1/wp008-ci-probe.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/evidence/week1/wp008-ci-probe.txt production/Cargo.lock || true
          if ! git diff --cached --quiet; then
            git commit -m 'ci(celestial): publish WP-008 validation probe [skip ci]'
            git push
          fi
          if [ "$FMT" -ne 0 ] || [ "$CLIPPY" -ne 0 ] || [ "$TEST" -ne 0 ] || [ "$WP008" -ne 0 ]; then exit 1; fi
