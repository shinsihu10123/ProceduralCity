name: WP008 final closure validation

on:
  push:
    branches:
      - execution/week1-wp008-final
    paths:
      - '.github/workflows/wp008-probe.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Validate closed evidence-bearing WP-008 state
        shell: bash
        run: |
          set +e
          cargo fmt --manifest-path production/Cargo.toml --all -- --check > /tmp/fmt.log 2>&1
          FMT=$?
          cargo clippy --manifest-path production/Cargo.toml --workspace --all-targets -- -D warnings > /tmp/clippy.log 2>&1
          CLIPPY=$?
          cargo test --manifest-path production/Cargo.toml --workspace > /tmp/workspace.log 2>&1
          WORKSPACE=$?
          cargo test --manifest-path production/Cargo.toml -p gaonn-celestial-core --test wp008 > /tmp/wp008.log 2>&1
          WP008=$?
          set -e
          PRESENT=$(test -f docs/evidence/week1/wp008-celestial-state.md && echo 1 || echo 0)
          CLOSED=$(grep -q '^Status: PASS / CLOSED$' docs/evidence/week1/wp008-celestial-state.md && echo 1 || echo 0)
          COUNT=$(grep -E '^running [0-9]+ tests$' /tmp/wp008.log | tail -n 1 | awk '{print $2}')
          {
            echo "WP008_FINAL_VALIDATED_HEAD=$(git rev-parse HEAD)"
            echo "EVIDENCE_PRESENT=$PRESENT"
            echo "EVIDENCE_CLOSED=$CLOSED"
            echo "FMT_EXIT=$FMT"
            echo "CLIPPY_EXIT=$CLIPPY"
            echo "WORKSPACE_TEST_EXIT=$WORKSPACE"
            echo "WP008_TEST_EXIT=$WP008"
            echo "WP008_TEST_COUNT=${COUNT:-unknown}"
            echo '--- WP008 TEST SUMMARY ---'
            tail -n 35 /tmp/wp008.log
          } > docs/evidence/week1/wp008-final-validation.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/evidence/week1/wp008-final-validation.txt
          git commit -m 'ci(celestial): publish final WP-008 closure validation [skip ci]'
          git push
          if [ "$PRESENT" -ne 1 ] || [ "$CLOSED" -ne 1 ] || [ "$FMT" -ne 0 ] || [ "$CLIPPY" -ne 0 ] || [ "$WORKSPACE" -ne 0 ] || [ "$WP008" -ne 0 ]; then exit 1; fi
