name: WP014 bounded rustfmt repair
on:
  push:
    branches:
      - execution/week1-wp014-transaction-precommit
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - run: |
          cargo fmt --manifest-path production/Cargo.toml --all
          if ! git diff --quiet; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add production/crates/transaction-precommit-core production/Cargo.toml production/Cargo.lock
            git commit -m 'style(transaction): apply canonical rustfmt for WP-014'
            git push
          fi
