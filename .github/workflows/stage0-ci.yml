name: Stage 0 CI

on:
  push:
    branches: [stage0-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust kernel, persistence, and headless runner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Export deterministic RenderSnapshot
        run: >-
          cargo run -p artificial-world-headless --
          --ticks 10000
          --seed 42
          --snapshot-output target/ci/render-snapshot.json

      - name: Verify snapshot file exists
        run: test -s target/ci/render-snapshot.json

      - name: Verify Save Load deterministic continuity
        run: |
          mkdir -p target/ci
          cargo run --quiet -p artificial-world-headless -- \
            --ticks 20000 \
            --seed 42 \
            > target/ci/direct.json
          cargo run --quiet -p artificial-world-headless -- \
            --ticks 10000 \
            --seed 42 \
            --save-output target/ci/world-save.json \
            > target/ci/checkpoint.json
          cargo run --quiet -p artificial-world-headless -- \
            --load target/ci/world-save.json \
            --ticks 10000 \
            > target/ci/resumed.json
          test -s target/ci/world-save.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("target/ci")
          direct = json.loads((root / "direct.json").read_text())
          checkpoint = json.loads((root / "checkpoint.json").read_text())
          resumed = json.loads((root / "resumed.json").read_text())

          assert checkpoint["tick"] == 10_000
          assert checkpoint["saveWritten"] is True
          assert resumed["loaded"] is True
          assert resumed["startTick"] == 10_000
          for field in ("tick", "seed", "digest"):
              assert resumed[field] == direct[field], (field, direct[field], resumed[field])

          print(json.dumps({
              "direct": direct,
              "checkpoint": checkpoint,
              "resumed": resumed,
              "continuity": "verified",
          }, separators=(",", ":")))
          PY

  viewer:
    name: Kernel snapshot to TypeScript viewer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export Viewer snapshot from Kernel
        run: >-
          cargo run -p artificial-world-headless --
          --ticks 10000
          --seed 42
          --snapshot-output apps/viewer/public/snapshots/latest.json

      - name: Install viewer dependencies
        run: npm install --prefix apps/viewer --no-audit --no-fund

      - name: Validate snapshot contract
        run: npm --prefix apps/viewer run validate:snapshot

      - name: Type-check and build viewer
        run: npm --prefix apps/viewer run build
