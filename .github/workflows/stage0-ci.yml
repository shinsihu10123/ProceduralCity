name: Stage 0 CI

on:
  push:
    branches: [stage0-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust kernel and headless runner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Run deterministic headless smoke test
        run: cargo run -p artificial-world-headless -- --ticks 10000 --seed 42

  viewer:
    name: TypeScript diagnostic viewer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install viewer dependencies
        run: npm install --prefix apps/viewer --no-audit --no-fund

      - name: Type-check and build viewer
        run: npm --prefix apps/viewer run build
