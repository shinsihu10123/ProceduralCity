name: Stage 0 CI

on:
  push:
    branches: [stage0-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust kernel, persistence, and headless runner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Export deterministic RenderSnapshot
        run: >-
          cargo run -p artificial-world-headless --
          --ticks 10000
          --seed 42
          --snapshot-output target/ci/render-snapshot.json

      - name: Verify snapshot file exists
        run: test -s target/ci/render-snapshot.json

      - name: Verify Save Load deterministic continuity
        run: |
          mkdir -p target/ci
          cargo run --quiet -p artificial-world-headless -- \
            --ticks 20000 \
            --seed 42 \
            > target/ci/direct.json
          cargo run --quiet -p artificial-world-headless -- \
            --ticks 10000 \
            --seed 42 \
            --save-output target/ci/world-save.json \
            > target/ci/checkpoint.json
          cargo run --quiet -p artificial-world-headless -- \
            --load target/ci/world-save.json \
            --ticks 10000 \
            > target/ci/resumed.json
          test -s target/ci/world-save.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("target/ci")
          direct = json.loads((root / "direct.json").read_text())
          checkpoint = json.loads((root / "checkpoint.json").read_text())
          resumed = json.loads((root / "resumed.json").read_text())

          assert checkpoint["tick"] == 10_000
          assert checkpoint["saveWritten"] is True
          assert resumed["loaded"] is True
          assert resumed["startTick"] == 10_000
          for field in ("tick", "seed", "digest"):
              assert resumed[field] == direct[field], (field, direct[field], resumed[field])

          print(json.dumps({
              "direct": direct,
              "checkpoint": checkpoint,
              "resumed": resumed,
              "continuity": "verified",
          }, separators=(",", ":")))
          PY

  benchmark:
    name: Stage 0 cloud baseline benchmark
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Record Rust version
        run: echo "RUSTC_VERSION=$(rustc --version)" >> "$GITHUB_ENV"

      - name: Run release baseline benchmark
        env:
          BENCHMARK_ENVIRONMENT: github-actions
        run: >-
          cargo run --release -p artificial-world-benchmark --
          --output target/benchmark/performance-run.json
          --seed 42
          --warmup-ticks 1000000
          --measured-ticks 10000000
          --samples 7
          --run-id github-${{ github.run_id }}-${{ github.run_attempt }}
          --build-id ${{ github.sha }}

      - name: Validate benchmark thresholds
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("target/benchmark/performance-run.json")
          data = json.loads(path.read_text())

          assert data["schemaVersion"] == "performance-run.v1"
          assert data["benchmarkId"] == "stage0-kernel-baseline.v1"
          assert data["hardware"]["environment"] == "github-actions"
          assert data["hardware"]["buildProfile"] == "release"
          assert data["configuration"]["sampleCount"] == 7
          assert data["configuration"]["measuredTicksPerSample"] == 10_000_000
          assert data["emptyTickThroughput"]["minimumTicksPerSecond"] >= 100_000
          assert data["snapshotWriteDuration"]["p95Ns"] <= 2_000_000_000
          assert data["saveWriteDuration"]["p95Ns"] <= 2_000_000_000
          assert data["saveLoadDuration"]["p95Ns"] <= 5_000_000_000
          assert data["snapshotBytes"] > 0
          assert data["saveBytes"] > 0
          assert len(data["finalDigest"]) == 16
          assert Path("target/benchmark/artifacts/render-snapshot.json").is_file()
          assert Path("target/benchmark/artifacts/world-save.json").is_file()

          print(json.dumps({
              "medianTicksPerSecond": data["emptyTickThroughput"]["medianTicksPerSecond"],
              "snapshotBytes": data["snapshotBytes"],
              "saveBytes": data["saveBytes"],
              "medianSnapshotWriteNs": data["snapshotWriteDuration"]["medianNs"],
              "medianSaveWriteNs": data["saveWriteDuration"]["medianNs"],
              "medianSaveLoadNs": data["saveLoadDuration"]["medianNs"],
              "digest": data["finalDigest"],
          }, separators=(",", ":")))
          PY

      - name: Upload benchmark manifest and artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage0-cloud-baseline-${{ github.run_id }}
          path: target/benchmark
          if-no-files-found: error
          retention-days: 30

  viewer:
    name: Kernel snapshot to TypeScript viewer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export Viewer snapshot from Kernel
        run: >-
          cargo run -p artificial-world-headless --
          --ticks 10000
          --seed 42
          --snapshot-output apps/viewer/public/snapshots/latest.json

      - name: Install viewer dependencies
        run: npm install --prefix apps/viewer --no-audit --no-fund

      - name: Validate snapshot contract
        run: npm --prefix apps/viewer run validate:snapshot

      - name: Type-check and build viewer
        run: npm --prefix apps/viewer run build
