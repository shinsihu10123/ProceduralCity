name: Economic Lab WP-RV05 GDP NIA Composition

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - 'economic-lab/scripts/nia-composition-diagnosis-v10.mjs'
      - '.github/workflows/economic-lab-rv05.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish WP-RV05 running beacon
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' > /tmp/rv05-running.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "target_url": os.environ["RUN_URL"],
              "description": "WP-RV05 GDP/NIA composition diagnosis is running",
              "context": "economic-lab/wp-rv05"
          }))
          PY
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/rv05-running.json
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run promoted 3-seed baseline GDP/NIA composition diagnosis
        working-directory: economic-lab
        env:
          DIAG_SCALE: 'baseline'
          DIAG_MONTHS: '12'
          DIAG_SEEDS: 'ECON-RV02-A,ECON-RV02-B,ECON-RV02-C'
          OUTPUT_JSON: 'performance-results/reality-diagnostics-rv05-nia-composition.json'
        run: |
          set -euo pipefail
          node scripts/nia-composition-diagnosis-v10.mjs &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            echo "[WP-RV05 heartbeat] diagnosis still running at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep 30
          done
          wait "$pid"
      - name: Upload WP-RV05 evidence
        uses: actions/upload-artifact@v4
        with:
          name: economic-lab-wp-rv05
          path: economic-lab/performance-results/reality-diagnostics-rv05-nia-composition.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish WP-RV05 final beacon
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESCRIPTION: ${{ job.status == 'success' && 'WP-RV05 GDP/NIA diagnosis passed' || 'WP-RV05 GDP/NIA diagnosis failed' }}
        run: |
          python - <<'PY' > /tmp/rv05-final.json
          import json, os
          print(json.dumps({
              "state": os.environ["API_STATE"],
              "target_url": os.environ["RUN_URL"],
              "description": os.environ["DESCRIPTION"],
              "context": "economic-lab/wp-rv05"
          }))
          PY
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/rv05-final.json
