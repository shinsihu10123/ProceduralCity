name: Economic Lab RV08 R4-BY Credit Application Queue

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - '.github/workflows/economic-lab-rv08-r4-by-credit-queue.yml'
      - 'economic-lab/scripts/rv08-credit-application-queue-coverage-v10.mjs'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  NODE_OPTIONS: --max-old-space-size=7168

jobs:
  launch-beacon:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d '{"state":"pending","context":"economic-lab/wp-rv08-r4-by","description":"R4-BY credit queue ablation running","target_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

  queue:
    name: R4-BY ${{ matrix.seedcase }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seedcase:
          - original-A__ECON-RV02-A
          - original-C__ECON-RV02-C
          - heldout-E__ECON-RV08-HOLDOUT-E
          - heldout-F__ECON-RV08-HOLDOUT-F
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Syntax gate
        working-directory: economic-lab
        run: node --check scripts/rv08-credit-application-queue-coverage-v10.mjs
      - name: Run credit queue coverage matrix
        working-directory: economic-lab
        env:
          CASE: ${{ matrix.seedcase }}
        run: |
          set -euo pipefail
          LABEL="${CASE%%__*}"
          SEED="${CASE#*__}"
          mkdir -p performance-results
          DIAG_SEED="$SEED" DIAG_MONTHS=36 \
          OUTPUT_JSON="performance-results/r4-by-${LABEL}.json" \
          node scripts/rv08-credit-application-queue-coverage-v10.mjs \
          | tee "performance-results/r4-by-${LABEL}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-by-${{ matrix.seedcase }}
          path: economic-lab/performance-results/r4-by-*
          if-no-files-found: warn
          retention-days: 90

  final-beacon:
    if: always()
    needs: queue
    runs-on: ubuntu-24.04
    steps:
      - name: Publish final status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.queue.result }}
        run: |
          if [ "$RESULT" = "success" ]; then
            STATE=success
            DESC='R4-BY credit queue ablation passed'
          else
            STATE=failure
            DESC="R4-BY incomplete: $RESULT"
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{\"state\":\"$STATE\",\"context\":\"economic-lab/wp-rv08-r4-by\",\"description\":\"$DESC\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
