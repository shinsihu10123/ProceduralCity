name: Economic Lab WP-RV07-P40 Stockout Memory Capacity Interaction

on:
  push:
    branches: [scratch/new-project-2026-08-12]
    paths:
      - 'economic-lab/scripts/stockout-memory-capacity-interaction-v10.mjs'
      - 'economic-lab/diagnostics/reality-validation/WP-RV07_P40_EXECUTION_2026-08-20.md'
      - '.github/workflows/economic-lab-rv07-p40.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Publish WP-RV07-P40 running beacon
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' > /tmp/rv07p40-running.json
          import json, os
          print(json.dumps({'state':'pending','target_url':os.environ['RUN_URL'],'description':'WP-RV07-P40 stockout-memory interaction is running','context':'economic-lab/wp-rv07-p40'}))
          PY
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" --data-binary @/tmp/rv07p40-running.json
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run stockout-censored sales memory x capacity interaction
        working-directory: economic-lab
        env:
          DIAG_SCALES: compact,baseline
          DIAG_MONTHS: 12
          DIAG_SEEDS: ECON-RV02-A,ECON-RV02-B,ECON-RV02-C
          OUTPUT_JSON: performance-results/reality-diagnostics-rv07-p40-stockout-memory-capacity.json
        run: node scripts/stockout-memory-capacity-interaction-v10.mjs
      - name: Upload WP-RV07-P40 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economic-lab-wp-rv07-p40
          path: economic-lab/performance-results/reality-diagnostics-rv07-p40-stockout-memory-capacity.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish WP-RV07-P40 final beacon
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESCRIPTION: ${{ job.status == 'success' && 'WP-RV07-P40 interaction passed hard gates' || 'WP-RV07-P40 interaction failed' }}
        run: |
          python - <<'PY' > /tmp/rv07p40-final.json
          import json, os
          print(json.dumps({'state':os.environ['API_STATE'],'target_url':os.environ['RUN_URL'],'description':os.environ['DESCRIPTION'],'context':'economic-lab/wp-rv07-p40'}))
          PY
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" --data-binary @/tmp/rv07p40-final.json
