name: WP-018 canonical format once

on:
  push:
    branches:
      - execution/week1-wp018-closure
    paths:
      - .github/workflows/wp018-format-once.yml

permissions:
  contents: write

concurrency:
  group: wp018-canonical-format-once
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: execution/week1-wp018-closure
          fetch-depth: 0
      - name: Install stable rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Apply canonical workspace formatting
        run: cargo fmt --manifest-path production/Cargo.toml --all
      - name: Commit canonical formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- production; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production
          git commit -m "WP-018: apply canonical cargo fmt"
          git push origin HEAD:execution/week1-wp018-closure
