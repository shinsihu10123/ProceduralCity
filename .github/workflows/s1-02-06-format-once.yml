name: One-time format S1.02.06

on:
  push:
    branches:
      - execution/week1-wp002-s1-02-06

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: execution/week1-wp002-s1-02-06

      - name: Format and commit once
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$COMMIT_MESSAGE" = "fix(retention): rustfmt S1.02.06" ]; then
            echo "Format commit observed; nothing to do."
            exit 0
          fi
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          cargo fmt --manifest-path production/Cargo.toml --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/Cargo.toml production/Cargo.lock production/crates/retention-core
          if git diff --cached --quiet; then
            echo "No format changes needed"
            exit 0
          fi
          git commit -m "fix(retention): rustfmt S1.02.06"
          git push origin HEAD:execution/week1-wp002-s1-02-06
