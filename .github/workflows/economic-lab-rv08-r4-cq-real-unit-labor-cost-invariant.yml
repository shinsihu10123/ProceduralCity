name: Economic Lab RV08 R4-CQ Real Unit Labor Cost Invariant Gate

on:
  push:
    branches:
      - scratch/new-project-2026-08-12
    paths:
      - 'economic-lab/scripts/rv08-r4-cq-real-unit-labor-cost-invariant-v10.mjs'
      - '.github/workflows/economic-lab-rv08-r4-cq-real-unit-labor-cost-invariant.yml'
      - 'economic-lab/diagnostics/reality-validation/WP-RV08-R4-CQ-REAL-UNIT-LABOR-COST-INVARIANT-DESIGN-2026-08-28.md'
  workflow_dispatch:

jobs:
  launch-beacon:
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'R4-CQ launched'

  r4-cq:
    needs: launch-beacon
    strategy:
      fail-fast: false
      matrix:
        case:
          - original-A__ECON-RV02-A
          - original-C__ECON-RV02-C
          - heldout-E__ECON-RV08-HOLDOUT-E
          - heldout-F__ECON-RV08-HOLDOUT-F
    name: R4-CQ ${{ matrix.case }}
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: --max-old-space-size=7168
      CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax gate
        run: node --check economic-lab/scripts/rv08-r4-cq-real-unit-labor-cost-invariant-v10.mjs
      - name: Run 24-month RULC invariant audit
        shell: bash
        run: |
          set -o pipefail
          LABEL="${CASE%%__*}"
          SEED="${CASE#*__}"
          mkdir -p economic-lab/performance-results
          DIAG_SEED="$SEED" DIAG_MONTHS=24 \
          OUTPUT_JSON="economic-lab/performance-results/r4-cq-${LABEL}.json" \
          node economic-lab/scripts/rv08-r4-cq-real-unit-labor-cost-invariant-v10.mjs \
          2>&1 | tee "economic-lab/performance-results/r4-cq-${LABEL}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-cq-${{ matrix.case }}
          path: economic-lab/performance-results/r4-cq-*
          retention-days: 90

  final-beacon:
    needs: r4-cq
    if: always() && needs.r4-cq.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'R4-CQ matrix completed'
